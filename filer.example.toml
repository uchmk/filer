# Copy to %APPDATA%\filer\filer.toml to change GUI-only settings.
# Everything else (keys, colors, openers, sorting) lives in yazi's own config
# files and is read from %APPDATA%\yazi\config first.

[ui]
# Base font size in points. Row height follows from this.
font_size = 14.0

# Extra vertical padding per row.
row_padding = 4.0

# Font files to try before the built-in list. Useful if your Nerd Font is not
# in the usual per-user font directory.
# fonts = ["C:/Users/you/AppData/Local/Microsoft/Windows/Fonts/HackGen35ConsoleNF-Regular.ttf"]
fonts = []

# Bold font files to try first. Without these, the "-Bold" sibling of the
# regular font is used, then Meiryo / Yu Gothic Bold; if nothing is found,
# bold text is faked by drawing it twice.
# bold_fonts = ["C:/Users/you/AppData/Local/Microsoft/Windows/Fonts/HackGen35ConsoleNF-Bold.ttf"]
bold_fonts = []

# Show Markdown previews rendered (with a table of contents on wide panes)
# rather than as highlighted source. `M` toggles this at runtime.
render_markdown = true

# auto  — Nerd Font icons when a Nerd Font was loaded, ASCII otherwise
# nerd  — force Nerd Font icons
# ascii — force the plain fallback
# none  — no icons at all
icons = "auto"

# How long the cursor must rest before a preview is read from disk.
# Lower feels more immediate; higher is kinder to a slow disk.
preview_debounce_ms = 40

# Cap on how much of a text file is read for the preview.
max_text_bytes = 262144

# Directories remembered for `z` (fuzzy jump).
max_history = 200

window_width = 1360.0
window_height = 860.0

# What draws the window: auto, vulkan, dx12, metal or gl. Read at start only.
# "auto" is GL on Windows when the machine has it (on some AMD GPUs an idle
# window keeps one core busy under Vulkan and DX12, and only GL stops it), and
# wgpu's own pick otherwise. Write "vulkan" or "dx12" to go back to those.
# The WGPU_BACKEND variable wins over this for a run. One this machine has no
# adapter for falls back to auto, with a warning.
backend = "auto"

[term]
# What `<C-t>` starts. Leave it out for the platform's own default, which on
# Windows is `powershell` — that is Windows PowerShell 5.1, not PowerShell 7.
# The two read different profiles:
#
#   pwsh   Documents\PowerShell\Microsoft.PowerShell_profile.ps1
#   5.1    Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1
#
# so a hook set up in one (the OSC 7 line `<A-Up>` needs, say) is simply not
# there in the other. Name the one you actually use.
# shell = "pwsh"
# args = ["-NoLogo"]

# Files filer cannot draw itself, drawn by something that can. Each rule is
# tried in order and the first whose `match` fits wins.
#
#   {path}  the file            (quoted for you)
#   {out}   where to write the picture, **without an extension** — whatever the
#           command leaves in that directory is what gets shown, so a tool that
#           appends its own suffix is fine
#   {n}     which picture: a page, or a second
#
# `unit` is what goes under the picture, with `{n}` where the number belongs:
# "page {n}" reads `page 3`, "{n}s" reads `50s`.
#
# `<A-j>` / `<A-k>` move `{n}` by `step`. There is no page count — the end of a
# document arrives as the command refusing, and its own words are shown.
#
# Neither tool ships with filer. `filer env` says whether they are on the PATH.
#
# [[preview]]
# match = "*.pdf"
# run = 'pdftoppm -png -singlefile -r 120 -f {n} -l {n} {path} {out}'
# first = 1
# step = 1
# unit = "page {n}"
#
# [[preview]]
# match = "*.{mp4,mkv,webm,mov,avi}"
# run = 'ffmpeg -v error -ss {n} -i {path} -frames:v 1 -y {out}.png'
# first = 0
# step = 10
# unit = "{n}s"
