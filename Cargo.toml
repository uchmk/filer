[package]
name = "filer"
version = "0.78.79"
edition = "2021"
rust-version = "1.95"
description = "A yazi-flavored, keyboard-driven file manager built with Rust + egui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/filer"
readme = "README.md"
# Only for the Windows resource that carries the icon; see build.rs.
build = "build.rs"
# `filer-com` (src/bin/filer-com.rs, v0.71.0) made two binaries, and a bare
# `cargo run` stopped knowing which one to start.
default-run = "filer"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
crossbeam-channel = "0.5"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
open = { version = "5", features = ["shellexecute-on-windows"] }
trash = "5"
arboard = "3"
notify = "8"
ignore = "0.4"
ab_glyph = "0.2"
ttf-parser = "0.25"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
sevenz-rust2 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
alacritty_terminal = { version = "0.26", default-features = false }
polling = "3"
# Already in the tree: syntect's `default-fancy` builds it. Naming it here is
# what lets bulk rename use it, and adds no crate to the build.
#
# Held at syntect's version rather than the newest, which is the whole point:
# syntect 5.3 asks for `0.16.2`, so a newer one here does not replace it, it
# joins it -- two regex engines compiled, 272 KB on the binary, for an API
# (`Regex::new`, `replace`, `replace_all`) that has not changed. Dependabot is
# told to leave it alone for the same reason; when syntect moves, this moves.
fancy-regex = "0.16"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "qoi"]

[dependencies.syntect]
version = "5"
default-features = false
features = ["default-fancy"]

# bat's syntax collection: TOML, TypeScript, Dockerfile and ~150 more
# languages that syntect's own bundle lacks.
[dependencies.two-face]
version = "0.5"
default-features = false
features = ["syntect-fancy"]

[dependencies.pulldown-cmark]
version = "0.13"
default-features = false

[profile.dev]
opt-level = 1

# No debug info for the dependencies, only for filer itself: a backtrace still
# names filer's own lines, and the 500-odd crates underneath stop being most of
# `target` (a cloud session filled its disk twice on 2026-10-03).
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_NetworkManagement_WNet", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

# The host, not the target: compiling a Windows resource needs the SDK's rc.exe,
# so this is only pulled in where it can actually run.
[target."cfg(windows)".build-dependencies]
winresource = "0.1"
