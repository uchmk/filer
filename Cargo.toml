[package]
name = "kura"
version = "0.97.0"
edition = "2021"
rust-version = "1.95"
description = "A yazi-flavored, keyboard-driven file manager built with Rust + egui"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uchmk/kura"
readme = "README.md"
# Only for the Windows resource that carries the icon; see build.rs.
build = "build.rs"
# `kura-com` (src/bin/kura-com.rs, v0.71.0) made two binaries, and a bare
# `cargo run` stopped knowing which one to start.
default-run = "kura"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
crossbeam-channel = "0.5"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2"
open = { version = "5", features = ["shellexecute-on-windows"] }
trash = "5"
arboard = "3"
notify = "8"
ignore = "0.4"
ab_glyph = "0.2"
ttf-parser = "0.25"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
sevenz-rust2 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
alacritty_terminal = { version = "0.26", default-features = false }
# The terminal pane (src/terminal.rs, src/ui/term.rs), shared with tsumugi
# since v0.78.125 and kept in uchmk/ito with the other shared crates since
# v0.93.10. Pinned to a commit, the same one for every ito crate; to take a
# fix, move `rev` and run `cargo build` so Cargo.lock follows. Pure Rust, like
# the rest.
ito-pane = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f", features = ["egui", "wgpu"] }
# The border above the terminal pane, dragged to change its height (Q94).
# From the same commit as the pane; it depends on nothing but egui.
ito-layout = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f", features = ["egui"] }
# `kura mcp` (Q95, Q96): the per-user door into the running window (Unix
# socket / named pipe) and the MCP server Claude Code talks to over stdio.
# Hand-written on serde_json, no async runtime. The same commit as the pane.
ito-ipc = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }
# The rule a search query matches by (`f` `s` `S` `/` `?` `F`), shared with tsumugi; the same commit as the others.
ito-match = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }
# The clock at the status bar's right end and the `[clock]` / `language` of the
# config shared by every uchmk app (common.toml); the same commit as the others.
ito-common = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f", features = ["clock"] }
ito-mcp = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }
# The settings screen (Ctrl+,): the frame, side nav, search and the shared
# Language / CLOCK rows every uchmk app draws alike, and the palette it paints
# with. The same commit as the others; pure Rust on egui.
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "90314f94820ed2b1c08b8610c0cf7bad59b07f7f" }
# Already in the tree: syntect's `default-fancy` builds it. Naming it here is
# what lets bulk rename use it, and adds no crate to the build.
#
# Held at syntect's version rather than the newest, which is the whole point:
# syntect 5.3 asks for `0.16.2`, so a newer one here does not replace it, it
# joins it -- two regex engines compiled, 272 KB on the binary, for an API
# (`Regex::new`, `replace`, `replace_all`) that has not changed. Dependabot is
# told to leave it alone for the same reason; when syntect moves, this moves.
fancy-regex = "0.16"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "qoi"]

[dependencies.syntect]
version = "5"
default-features = false
features = ["default-fancy"]

# bat's syntax collection: TOML, TypeScript, Dockerfile and ~150 more
# languages that syntect's own bundle lacks.
[dependencies.two-face]
version = "0.5"
default-features = false
features = ["syntect-fancy"]

[dependencies.pulldown-cmark]
version = "0.13"
default-features = false

[profile.dev]
opt-level = 1

# No debug info for the dependencies, only for kura itself: a backtrace still
# names kura's own lines, and the 500-odd crates underneath stop being most of
# `target` (a cloud session filled its disk twice on 2026-10-03).
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_WNet", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }

# The host, not the target: compiling a Windows resource needs the SDK's rc.exe,
# so this is only pulled in where it can actually run.
[target."cfg(windows)".build-dependencies]
winresource = "0.1"
