  <rect x="0" y="0" width="200" height="200" fill="url(#bgGrad)"/>

  <g fill="#e8c9ff" opacity="0.4">
    <circle cx="30" cy="42" r="1.6"/>
    <circle cx="172" cy="54" r="1.3"/>
    <circle cx="26" cy="152" r="1.4"/>
    <circle cx="176" cy="146" r="1.6"/>
    <circle cx="100" cy="22" r="1.2"/>
    <circle cx="46" cy="100" r="1.1"/>
    <circle cx="154" cy="96" r="1.3"/>
  </g>

  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.75"/>
  <circle cx="100" cy="100" r="98.5" fill="none" stroke="#e8c9ff" stroke-width="1" opacity="0.35"/>

  <polygon points="58,72 76,18 94,66" fill="url(#earGrad)"/>
  <polygon points="142,72 124,18 106,66" fill="url(#earGrad)"/>
  <polygon points="66,64 77,32 87,60" fill="url(#innerEarGrad)"/>
  <polygon points="134,64 123,32 113,60" fill="url(#innerEarGrad)"/>

  <polygon points="58,86 54,112 66,138 100,156 134,138 146,112 142,86 118,64 82,64" fill="url(#headGrad)"/>
  <line x1="120" y1="68" x2="138" y2="86" stroke="#e8c9ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <polygon points="100,52 90,70 98,70 92,88 110,66 100,66" fill="#e8c9ff" style="filter:drop-shadow(0 0 5px #9a4de0)"/>

  <g style="filter:drop-shadow(0 0 6px #ff3ec9)">
    <polygon points="72,96 91,90 93,98 75,104" fill="url(#eyeGrad)"/>
    <polygon points="128,96 109,90 107,98 125,104" fill="url(#eyeGrad)"/>
  </g>

  <polygon points="100,140 106,148 100,156 94,148" fill="#05030a"/>
