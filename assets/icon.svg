<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 200 200" role="img" aria-label="Volt Fox channel icon">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#3a1568"/>
      <stop offset="40%" stop-color="#1c0a34"/>
      <stop offset="75%" stop-color="#0d0616"/>
      <stop offset="100%" stop-color="#05030a"/>
    </radialGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b21b3"/>
      <stop offset="100%" stop-color="#1c0a34"/>
    </linearGradient>
    <radialGradient id="innerEarGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff8be0"/>
      <stop offset="60%" stop-color="#ff3ec9"/>
      <stop offset="100%" stop-color="#b81fae"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="50%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#a35de8"/>
      <stop offset="40%" stop-color="#7a2ec2"/>
      <stop offset="75%" stop-color="#45188a"/>
      <stop offset="100%" stop-color="#220d47"/>
    </radialGradient>
    <linearGradient id="eyeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffd6fb"/>
      <stop offset="65%" stop-color="#ff5fd8"/>
      <stop offset="100%" stop-color="#b81fae"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
