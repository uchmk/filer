name: Test on macOS

# `cargo test` on macOS, which no one had ever run (Q74). Weekly and from the
# Actions tab rather than on every change: a macOS runner bills ten times a
# Linux one, and filer is developed and tested on Windows first. Once a week
# is enough to learn whether the tests hold there at all, and a failure here
# goes to TODO.md rather than blocking anything.
#
# Apple Silicon only. The Intel image (`macos-13`) is gone -- build.yml found
# out the hard way and now cross-compiles x64 from this same runner -- so an
# Intel test run would be the ARM machine under Rosetta, not an Intel Mac.

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-14
    # A hung test otherwise holds the runner for the default six hours, at
    # ten times a Linux minute: the first run hung on two pane tests and was
    # stopped by hand after half an hour. Cold, build and tests take ~5 min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
