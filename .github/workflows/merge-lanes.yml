name: Merge lanes

# Merges the real-machine lanes' pull requests (test/win-*, test/arm-*,
# test/linux-*) once they keep to the rules in scripts/merge-lanes.py and
# their checks are green, with a merge commit pinned to the head. The merge
# routine (.claude/merge-routine.md) used to merge them, and the cloud
# session's auto mode refused the merge (2026-10-10, #309 / #310); the
# routine now does the merger's share. A pull request that conflicts only in
# the checklists it merges itself (v0.86.9): main's file with the pull
# request's marks made again, checked to be marks only, pushed to main.
#
# It runs when a check workflow finishes (a lane's pull request turns green),
# every hour as a fallback, and by hand. It reads pull requests through the
# API and runs only main's copy of the script, never the pull request's code.

on:
  workflow_run:
    workflows: [CI, Checklists, Audit]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would be merged, merge nothing
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read

concurrency:
  group: merge-lanes
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The whole history, and the token kept, so that a checklist
          # conflict can be merged locally and pushed to main.
          fetch-depth: 0
      - name: Self-test
        run: python3 scripts/merge-lanes.py --self-test
      - name: Merge what may be merged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_LANES_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python3 scripts/merge-lanes.py
