name: Release

# A build that keeps its name, does not expire, and downloads without an
# account.
#
# `build.yml` already produces one on every push, but an Actions artifact is
# named after a commit, needs a signed-in GitHub account to fetch, and is
# deleted after 90 days -- so a link to it stops working, and never said which
# version it held. A release asset is named for the tag, stays, and since the
# repository went public answers an anonymous request (v0.9.2 tested the same
# fetch while it was private and got 404).
#
# Six files, on two jobs. Windows builds both its architectures on one x64
# runner because there is no ARM64 Windows runner; macOS and Linux have native
# runners for each, so those four build where they run. The split is explained
# where the second job starts.

on:
  push:
    tags: ['v*']
  # Or by hand, to cut one without tagging first.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.6.0. It is created if it does not exist.'
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `softprops/action-gh-release` reads the changelog out of the tree,
          # and the notes below want the tag's own commit.
          fetch-depth: 0

      - name: Work out the tag
        id: tag
        shell: bash
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # The version in the tag and the version in Cargo.toml disagreeing is the
      # one mistake worth failing the release for: whoever downloads it would
      # have no way to tell which they have.
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag="${{ steps.tag.outputs.name }}"
          if [ "v$crate" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml's $crate"
            exit 1
          fi
          echo "$tag matches Cargo.toml"

      - name: Add the ARM64 target
        run: rustup target add aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # x64 only, and that is a limit rather than a choice: the runner is an x64
      # machine and cannot execute an ARM64 binary, so there is nothing to run
      # the ARM64 tests with. The two builds come from one source and one set of
      # `#[cfg]`s, so a test passing here is good evidence for both -- but it is
      # evidence, not a run. Anything architecture-specific has to be caught on
      # a real ARM64 machine.
      - name: Test
        run: cargo test --locked

      - name: Build x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build ARM64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      # Named for the version and the architecture rather than the commit: these
      # are meant to be linked to and recognised. The architecture is in the
      # filename because it is the first thing a bug report needs to establish,
      # and a downloaded file is otherwise silent about which one it is.
      #
      # A zip rather than a bare .exe since v0.49.0: filer.exe travels with a
      # newer ConPTY (conpty.dll, OpenConsole.exe) and its licence notice. The
      # ConPTY built into Windows breaks programs run in the terminal pane --
      # scripts/fetch-conpty.ps1 says how -- and alacritty_terminal picks the
      # newer one up from beside the executable. Each zip holds one folder, so
      # extracting it does not scatter three files into Downloads.
      - name: Package the binaries
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($pair in @(@('x64', 'x86_64-pc-windows-msvc'), @('arm64', 'aarch64-pc-windows-msvc'))) {
            $arch, $target = $pair
            $name = "filer-$tag-windows-$arch"
            $stage = "stage/$name"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "target/$target/release/filer.exe" $stage
            # The console front (v0.71.0, Q44): `filer env` and `--version`
            # typed in PowerShell find filer.com first and are waited for.
            Copy-Item "target/$target/release/filer-com.exe" "$stage/filer.com"
            pwsh -File scripts/fetch-conpty.ps1 -Arch $arch -Dest $stage
            if ($LASTEXITCODE -ne 0) { throw "fetching ConPTY for $arch failed" }
            Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force
          }
          Get-ChildItem dist

      # Release notes in English, from the commits.
      #
      # CHANGELOG.md is in Japanese and stays that way -- it is what the author
      # reads. A release page has the opposite audience, and translating by hand
      # means writing everything twice, which ends with the two disagreeing and
      # no way to tell which is right.
      #
      # So neither is written again: commit messages here are already English
      # (CLAUDE.md requires it) and already one per version, because the version
      # bump and the changelog entry are committed together. That makes a commit
      # and a release note the same unit of writing, and the English exists
      # before the release is cut.
      #
      # First paragraph only. The full message argues the change through -- what
      # was tried, what it cost, what the tests caught -- which is right in a
      # commit and too much on a download page. The paragraph that opens a
      # commit here says what changed and why; the rest is a click away.
      - name: Write the notes from the commits
        id: notes
        shell: bash
        run: |
          # The notes, the platforms note and the CHANGELOG link. In a script
          # so that release-sums.yml can write an existing page again with the
          # same text (v0.79.0's was cut off before its table).
          bash scripts/release-body.sh "${{ steps.tag.outputs.name }}" HEAD > notes.md
          echo "wrote $(wc -l < notes.md) lines of notes"
          cat notes.md

      # `target_commitish` is the commit the tag is created at, and leaving it
      # out is not "the commit this ran on" -- it is the default branch's HEAD
      # at the moment the release is made. A release takes twenty-five minutes,
      # so anything pushed to main in that window moves the tag off the build.
      # It happened twice before this line existed: v0.32.2's tag landed on the
      # v0.32.3 commit and v0.33.7's on the v0.33.9 commit, which makes the tag
      # lie about what was shipped and makes the next release's notes start from
      # the wrong place -- v0.32.3 is missing from v0.33.7's notes for exactly
      # this reason.
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          body_path: notes.md
          files: dist/*.zip
          fail_on_unmatched_files: true

  # macOS and Linux, added to the release the Windows job has already made.
  #
  # Ordered by `needs` rather than run alongside, and that ordering is the point:
  # creating a release is the one step that must happen exactly once. Four jobs
  # racing to create it would have three of them find it half-made. Here the
  # release exists before any of these start, so each only attaches a file, and
  # attaching different filenames in parallel is safe.
  #
  # The cost of the ordering is that a failure here lands on a release that is
  # already public with its Windows assets on it. That is the right way round:
  # Windows is the platform this is tested on, and the rest are an addition to a
  # release rather than a condition for one.
  unix:
    needs: windows
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should not stop the others being attached.
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled from the ARM runner. This said `macos-13` until
          # v0.47.28, and that image is gone: the job simply queued, for over a
          # day in the run that finally exposed it, and no `macos-x64` build
          # has succeeded in the last 100 runs. Nothing failed, so nothing said
          # so -- the release just came out with five assets where the notes
          # promise six. Apple's SDK carries both architectures, so an ARM
          # runner builds this target with nothing but `rustup target add`.
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Work out the tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # `.tar.gz` rather than the bare binary: a GitHub release asset does not
      # carry the executable bit, so a downloaded `filer` would need `chmod +x`
      # before it would run. A tar does carry it.
      - name: Pack
        run: |
          tag="${{ steps.tag.outputs.name }}"
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
              -czf "dist/filer-$tag-${{ matrix.name }}.tar.gz" filer
          ls -l dist

      # No `body` and no `name`: the Windows job wrote those, and passing them
      # again from four jobs at once would have them overwrite each other with
      # the same text for no reason.
      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # Same commit the Windows job pinned the tag to. The release and the
          # tag both exist by now, so this changes nothing -- it is here so that
          # the two jobs cannot disagree if the ordering ever does.
          target_commitish: ${{ github.sha }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true

  # The SHA-256 of every asset, and of every file inside each Windows zip,
  # written onto the release page once all six are attached.
  #
  # A job of its own because it is the one place that sees every asset: the
  # Windows job writes the notes before the other four exist, and those four
  # run at once, so any of them appending to the body would race the others.
  # Somebody who downloaded the zip cannot run fetch-conpty.ps1 to check the
  # two ConPTY files beside filer.exe; this table is how they check them.
  #
  # `always()` so a platform that failed to build does not keep the others'
  # hashes off the page -- the table lists what is there. The work is in
  # release-sums.yml, which can also be run by hand for a release already out.
  sums:
    needs: [windows, unix]
    if: always() && needs.windows.result == 'success'
    uses: ./.github/workflows/release-sums.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
