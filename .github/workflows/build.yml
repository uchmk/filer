name: Build

# A downloadable binary, so getting one does not mean having a Rust toolchain to
# hand. Kept apart from `ci.yml` on purpose: this one produces an artifact, that
# one is the gate, and a failure here should not read as a failing test.
#
# Six targets across three operating systems. Windows is the one that is tested
# by hand, and the rest are here to answer whether they build at all -- a
# question that otherwise gets answered by somebody else, after a release, in an
# issue. Type-checking them from Linux (`cargo check --target ...`) already
# passes, but that never links, and linking is where a platform's own frameworks
# come in. This is the step that actually finds out.
#
# The two Windows builds share one x64 runner, since there is no ARM64 Windows
# runner. Windows on ARM runs x64 binaries under emulation, so an ARM64 machine
# can always open the x64 build -- but that tests the emulator as much as the
# program, and the cross build is nearly free. macOS and Linux both have native
# runners for each architecture, so those six are built where they run.
#
# Free because the repository is public. On a private repository this would bill
# against the account's Actions allowance, at double for Windows and ten times
# for macOS, which is what made two targets the sensible number before.

on:
  push:
    branches: [main]
  # Or from the Actions tab, on any branch, whenever a build is wanted.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # One target failing should not cancel the others: which of them broke,
      # and whether the rest still build, is the useful information -- and with
      # platforms that nobody runs by hand, that is most of the value here.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled from the ARM runner. This said `macos-13` until
          # v0.47.28, and that image is gone: the job simply queued, for over a
          # day in the run that finally exposed it, and no `macos-x64` build
          # has succeeded in the last 100 runs. Nothing failed, so nothing said
          # so -- the release just came out with five assets where the notes
          # promise six. Apple's SDK carries both architectures, so an ARM
          # runner builds this target with nothing but `rustup target add`.
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      # A no-op where the target is the runner's own, which is every job but the
      # two Windows ones. Left unconditional because a rustup that already has
      # the target says so and exits, and a condition would be more to read.
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Without this the jobs sharing a runner image share one cache entry
          # and keep evicting each other's artifacts, since they differ only by
          # target.
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The release binary is a GUI-subsystem program, and until v0.54.4 its
      # `kura env` and `--version` wrote only to the screen: redirected to a
      # file or a pipe they gave nothing at all, and a debug build -- which is
      # all the test job ever runs -- cannot show it, because it owns a
      # console. So this runs the binary that actually ships. x64 only: the
      # runner cannot execute the ARM64 build.
      - name: Its output can be redirected
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/kura.exe"
          # PowerShell's own `>` does not connect a GUI-subsystem program's
          # output to the file at all (found here: 0 bytes, process already
          # gone), so the forms checked are the ones that do reach it: a pipe
          # into Out-File, cmd's `>`, and a pipe into another command.
          & $exe --version | Out-File -Encoding utf8 version.txt
          $v = Get-Content -Raw version.txt
          if (-not ($v -match '^kura \d')) { throw "--version | Out-File gave: '$v'" }
          cmd /c "`"$exe`" env > env.txt"
          $e = Get-Content -Raw env.txt
          if (-not ($e -match 'Process arch')) { throw "cmd's > gave: '$e'" }
          $arch = & $exe env | Select-String 'Process arch'
          if (-not $arch) { throw "kura env | Select-String found no 'Process arch' line" }
          # `env --out` (v0.68.0): kura writes the file itself. Start-Process
          # -Wait because PowerShell would not wait for it otherwise.
          $p = Start-Process -FilePath $exe -ArgumentList 'env','--out','env-out.txt' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "env --out exited $($p.ExitCode)" }
          $o = Get-Content -Raw -Encoding utf8 env-out.txt
          if (-not ($o -match 'Process arch')) { throw "env --out gave: '$o'" }
          "Out-File: $v"
          "cmd >:    $((Get-Item env.txt).Length) bytes"
          "piped:    $arch"
          "--out:    $((Get-Item env-out.txt).Length) bytes"
          # kura.com (v0.71.0, Q44): the console front the zip ships beside
          # kura.exe. Being a console program, PowerShell waits for it, so the
          # bare forms that come back empty from kura.exe have to work here.
          $com = "target/${{ matrix.target }}/release/kura.com"
          Copy-Item "target/${{ matrix.target }}/release/kura-com.exe" $com
          $lines = & $com env
          if ($lines.Count -lt 10) { throw "`$v = & kura.com env gave $($lines.Count) line(s)" }
          $ver = & $com --version
          if (-not ($ver -match '^kura \d')) { throw "& kura.com --version gave: '$ver'" }
          # The refusal comes through kura.com's own pipe since v0.73.6 (#192):
          # the window no longer gets this console's handles.
          $said = & $com --keys "<Tab"
          $refused = $LASTEXITCODE
          if (-not ("$said" -match 'kura: --keys')) { throw "kura.com --keys `"<Tab`" said: '$said'" }
          # The step ends with `exit $LASTEXITCODE`, and this 2 is the pass.
          $global:LASTEXITCODE = 0
          if ($refused -ne 2) { throw "kura.com --keys `"<Tab`" exited $refused, not kura.exe's 2" }
          "kura.com: $($lines.Count) lines, $ver, refusal exit $refused ($said)"

      - name: Gather the files
        shell: bash
        run: |
          mkdir -p dist
          # Windows is the only one that names the binary `kura.exe`.
          cp target/${{ matrix.target }}/release/kura${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          # And it gets the console front beside it, under the name that makes
          # `kura` find it first (v0.71.0, src/bin/kura-com.rs).
          if [ "${{ runner.os }}" = Windows ]; then cp target/${{ matrix.target }}/release/kura-com.exe dist/kura.com; fi

      # Windows ships a newer ConPTY beside kura.exe; see
      # scripts/fetch-conpty.ps1 for why.
      - name: Add the bundled ConPTY
        if: runner.os == 'Windows'
        run: pwsh -File scripts/fetch-conpty.ps1 -Arch ${{ contains(matrix.target, 'aarch64') && 'arm64' || 'x64' }} -Dest dist

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          # The commit is in the name, so two downloads are never confused.
          name: kura-${{ matrix.name }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
