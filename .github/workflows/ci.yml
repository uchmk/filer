name: CI

# Files that cannot change what the build does. TESTING.md is deliberately not
# here -- it is what `make-testcheck --check` compares against, so a change to it
# is exactly when those steps have to run. The generated checklists are (since
# v0.73.15): a pull request that only ticks them cannot break a build, and
# checklists.yml runs the one check that applies to it in a minute rather than
# the Windows test job's half hour. Neither is `Cargo.toml`, which carries the version
# `--locked` checks, nor `.github/**`, since a change to CI should be run by CI.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'TODO.md'
      - 'QUESTIONS.md'
      - 'QA-REPORT.md'
      - 'qa-reports/**'
      - 'TESTING-CHECKS.md'
      - 'TESTING-LINUX.md'
      - 'TESTING-KEYS.md'
      - '.claude/**'
      - 'LICENSE'
  # the merge-lanes workflow's share bumps the version on main with a token
  # whose pushes start no workflows, so it starts this run itself
  workflow_dispatch:
  pull_request:
    # Repeated rather than anchored: GitHub's own parser handles YAML anchors,
    # but every tool that reads this file has to, and a silently-ignored alias
    # here would mean CI quietly stops running on pull requests.
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'TODO.md'
      - 'QUESTIONS.md'
      - 'QA-REPORT.md'
      - 'qa-reports/**'
      - 'TESTING-CHECKS.md'
      - 'TESTING-LINUX.md'
      - 'TESTING-KEYS.md'
      - '.claude/**'
      - 'LICENSE'

# A second push to the same branch makes the first run's answer worthless before
# it arrives. Without this they queue, and the newest -- the only one anyone is
# waiting for -- starts last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Windows is the target platform, so that is where the build has to hold.
    #
    # Pull requests and pushes to `main` alike. This was pull requests only for
    # a while -- a pull request's checks already ran on the merged tree, and this
    # is the slowest job here (a Windows build is ~160s) -- but code goes to
    # `main` directly too, and such a commit was then never built or tested on
    # Windows at all: `#[cfg(windows)]` code and tests went unchecked until a
    # release ran them (v0.72.3). A merge now tests the same tree twice; that is
    # the price of the direct pushes being checked.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Restore on every run, but only `main` writes. A cache saved during a
      # pull request is scoped to `refs/pull/N/merge` and no later run can read
      # it, so every pull request was filling the repository's 10GB allowance
      # with entries that would only ever be evicted. Pull requests read
      # `main`'s, which is the one that is actually warm.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
      # The ConPTY that Windows builds ship beside kura.exe (see
      # scripts/fetch-conpty.ps1). Fetched here, on every pull request, so that
      # a broken script, a moved URL or a package whose hash no longer matches
      # fails the change that caused it rather than the next release.
      - name: Fetch the bundled ConPTY
        run: |
          pwsh -File scripts/fetch-conpty.ps1 -Arch x64 -Dest "$env:RUNNER_TEMP/conpty"
          foreach ($f in 'conpty.dll', 'OpenConsole.exe', 'ConPTY-LICENSE.txt') {
            if (-not (Test-Path "$env:RUNNER_TEMP/conpty/$f")) { throw "missing $f" }
          }
          Get-ChildItem "$env:RUNNER_TEMP/conpty"

  # Every PowerShell script under scripts/ parses. The Windows lanes run
  # auto-wintest.ps1 from a worktree the script moves to origin/main itself, so
  # a copy that does not parse cannot fetch its own fix: v0.78.167's syntax
  # error stopped both lanes for three days (v0.80.13). The runner has pwsh.
  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse scripts/*.ps1
        run: pwsh -NoProfile -File scripts/check-ps1.ps1

  # The same tests on Linux (Q74). They have been green there since v0.44.1, and
  # the cloud sessions run them on every change, but nothing made a red one
  # stop a merge: a test that only passes on Windows, or only on Linux, went
  # unnoticed until someone happened to run it on the other. Linux is the cheap
  # runner. macOS is not tested: a weekly macOS run was tried in v0.75.22 and
  # dropped in v0.75.25, since its minutes cost ten times a Linux one.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked

  # Does the Linux binary actually start?
  #
  # Until this job existed, CI knew one thing about the Linux and macOS builds:
  # that they compile and link. The release notes said exactly that -- "nobody
  # has started the program on either" -- so a binary that panicked on launch,
  # or opened a window and painted nothing, would have shipped green. This does
  # not test what kura *does*; it tests the thing every other check assumes.
  #
  # It found something on its first run: with no Nerd Font present the icon
  # column still reserved a full em for a one-character ASCII fallback, so every
  # directory row read `/      name`. Nobody had seen it because nobody had run
  # the program without that font.
  #
  # Linux only. macOS runners have no software Vulkan and the same trick does
  # not transfer, so that half of the gap stays open -- see TODO.md.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # lavapipe is Mesa's software Vulkan. eframe draws through wgpu, which
      # wants an adapter, and a runner has no GPU -- so this stands in. Slow and
      # correct, and correctness is the whole ask.
      - name: Install a display and a software GPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick x11-utils \
            mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Build
        run: cargo build --locked
      - name: Start it and photograph it
        run: scripts/smoke-linux.sh --out smoke.png
      # Kept whether or not the step passed: a failure here is a picture of
      # something, and the picture is the report.
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-smoke
          path: smoke.png
          if-no-files-found: warn

  # CLAUDE.md says clippy is kept at zero warnings with `--all-targets`, and
  # until now the only thing enforcing that was remembering to run it. That is
  # the same shape of mistake that kept CI red from v0.20.0 to v0.32.0: a rule
  # written down, and no machine reading it.
  #
  # On Linux, where clippy is a tenth of the price and the lints are the same
  # ones -- this catches the code both platforms compile, which is nearly all of
  # it. What it cannot see is `#[cfg(windows)]` code, so the Windows target is
  # checked too; that one does not link, which is fine, because clippy never
  # needed to.
  #
  # `-D warnings` means a Rust release that adds a lint can turn this red on a
  # day nothing changed here. That is the accepted cost of the rule being real:
  # the alternative is a warning nobody reads.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Add the Windows target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Clippy (Linux)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (Windows-only code)
        run: cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      # TESTING-KEYS.md is generated from the default keymap, and a checklist that
      # has drifted is worse than none: it certifies keys nobody tried. When this
      # went in it found the file nine keys and two descriptions out of date --
      # the help layer had gained its scrolling keys in v0.34.0 and the checklist
      # still listed one binding for it.
      - name: The key checklist matches the keymap
        run: cargo run --locked --example make-keycheck -- --check
      # TESTING-CHECKS.md is the same bargain for TESTING.md: it is generated, it
      # carries a human's ticks, and a check added to TESTING.md and never
      # regenerated here is a check that never reaches the person working through
      # the list. Renumbering is the sharp edge -- a tick stays on its id, so an
      # id that moves to a different row silently certifies the wrong thing.
      - name: The manual checklist matches TESTING.md
        run: cargo run --locked --example make-testcheck -- --check
      # The Linux lane's copy of the same rows (.claude/linux-role.md), with its
      # own marks. Kept in step for the same reason as the Windows one.
      - name: The Linux checklist matches TESTING.md
        run: cargo run --locked --example make-testcheck -- --lane linux --check
