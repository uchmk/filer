version: 2

# Version updates, which are not the same thing as the security alerts in the
# repository's settings: alerts say a dependency is vulnerable, this opens the
# pull request that moves off it.
#
# Monthly and grouped, because the failure mode for a solo project is not
# missing an update, it is twenty open pull requests nobody reads -- and a
# review queue that is ignored is worse than none, since a real one gets lost
# in it. One pull request a month, carrying everything, is something that can
# actually be looked at: CI decides whether it builds, and the whole thing
# merges or does not.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]

  # The actions in `.github/workflows` pin major versions, so this is what moves
  # `@v4` to `@v5` rather than letting it sit until an action is deprecated and
  # the warning turns into a failure.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
