'37.8' = '''README の設定例（32.1）で、PDF で `O` → Edge、Chrome、既定アプリ、そのあとエディタ群がこの順に並ぶ。`FILER_KEYS_DONE` の `pick:` の行で読める'''
'37.8a' = '''37.8 の一覧の項目を順に選ぶ → それぞれ表示どおりのものが起動する。この機械に入っていないプログラムや、関連付けの無い拡張子は、理由を書いて飛ばす（失敗ではない）'''

# 39. ターミナルペインの <A-j> / <A-k>
"39.1" = '`<C-t>` で長いもの（`dir /s` や `ls -R`）を実行してから `<A-k>` → スクロールバックが 1 回につき 5 行**上**へ'
