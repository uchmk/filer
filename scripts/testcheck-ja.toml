"46.10" = '最後のコミットの件名に日本語や絵文字が入っているファイルで `<Tab>` → 文字化けせずそのまま描かれる（書式が NUL 区切りなので引用が要らない）'
"46.11" = 'コンソールの窓が出ないか見張る → **一瞬も出ない。**`git` は status ワーカーと同じく `CREATE_NO_WINDOW` で起動される'
"46.12" = 'マージ済みの pull request 経由で入ったコミットを持つファイルで `<Tab>` → `Came in via` が `#<n>` と merge の短いハッシュ、`From branch` がブランチ名'
"46.13" = '`#<n>` を GitHub の pull request と突き合わせる → **同じ番号**で、そのファイルがその PR の差分に入っている。番号は merge コミットの件名から読んでいて何も取得していないので、**件名が出所であることを示すのがこの行**'
"46.14" = '最後のコミットが **`main` に直接** push されたファイルで `<Tab>` → **`Came in via` も `From branch` も出ない。**履歴の行だけ。あとから来ただけの merge に帰属させてはいけない'
"46.15" = '現在のブランチでコミットし **まだマージしていない**ファイルで `<Tab>` → 同じく履歴の行だけで `Came in via` は出ない。まだどこにも到着していないので訊く相手がいない'
"46.16" = "回線を抜く、Wi-Fi を切る、または Windows ファイアウォールで `filer.exe` と `git.exe` の外向き通信を塞ぐ —— そのうえで 46.12 をやり直す → **同じ出力・同じ速さ。**ここは何もマシンの外に出ない。ファイアウォールの方法は、実機で動くセッション向け（前の 2 つだとセッション自体が切れる）"
"46.17" = "spot パネルで `C`（v0.52.0）→ 全部の行が `ラベル<TAB>値` の形でクリップボードに入る。節ごとに見出しの下、節と節の間は空行。トーストが行数を言う"
"46.18" = "GitHub のリポジトリの clone で、46.12 のファイルの `Pull request` の行 → 上の `#<n>` の `https://github.com/<owner>/<repo>/pull/<n>` と出る。その行か `Came in via` の行で `<Enter>` を押すと、そのページがブラウザで開く"
"46.19" = "`origin/HEAD` のある clone で、46.15 のファイル（コミット済み・未マージ）→ **`Not merged`** の行に `not in origin/main yet`（その clone の既定のブランチ）。46.14 のファイル（main に直接）にはこの行が**無い**ので、2 つが同じ見た目ではなくなった"
'46.21' = '''プルリクエストで入ったファイルで `<Tab>`、カーソルを `From branch` に置いて `<Enter>`（v0.59.1）→ ブラウザが枝のページ（`…/tree/<枝>`）を開き、トーストが `Opened …` と言う。マージ後に消された枝なら GitHub 自身の 404 が開くが、アドレスとしては正しい'''
"46.20" = "`origin/HEAD` の無いリポジトリ（`git remote set-head origin -d`）で同じこと → `Not merged` の行は出ない。既定のブランチを推測しない"

# 13. シンボリックリンク
"13.7" = 'ジャンクション（`mklink /J`）で試す → シンボリックリンクと同じ扱い（名前の後ろに `->` が付き、`g`+`f` で追える）'
"13.8" = '`y` してから、別のディレクトリで `-` → シンボリックリンクができる。**Windows では開発者モードが要る**（設定 > システム > 開発者向け）。無いと `os error 1314` で失敗し、トーストが対処法を 2 つ示す'
"13.8a" = '開発者モードが無く昇格もしていない状態で、**フォルダ**を `y` し、別のディレクトリで `-`（v0.67.11）→ 同じ拒否のあとに `A junction needs neither: cmd /d /c mklink /J "<リンク>" "<フォルダ>"` が続き、パスは両方とも絶対パス（`cmd /d /c` は v0.72.6 から、#193）。それを `cmd` **にも** `pwsh`（filer のペイン、`<C-t>`）にも貼ってジャンクションができ、`g` `f` でたどれる。ファイルへの `-` ではジャンクションのことは言わない（フォルダ専用なので）。v0.67.19 からは続けて `Make a junction instead?` と聞く（両方のパスを挙げ、ジャンクションは相対にならずネットワークの場所を指せないと言う）。`n` なら何も残らない'
"13.8b" = '13.8a に続けて `y`（v0.67.19、Q46）→ トースト `Made a junction <名前> — u to undo`。`(Get-Item <リンク>).LinkType` が `Junction` で、`g` `f` でたどれる。`u` はジャンクションだけを消し（フォルダと中身は残る）、`Removed the junction <名前>` と言う。`U` でまたジャンクションとして作られ、`Made the junction <名前> again` と言う（v0.70.3。それまでは 2 つとも `link` と言っていた、#185）'
'13.8c' = '''13.8a に続けて、質問で `c`（v0.71.4、Q56）→ 質問の `y` と `n` の間に `[c] Copy the mklink command` がある。`c` で質問が閉じ、何も作られず（作り先のフォルダは空のまま）、トースト `Copied the mklink command — it runs in cmd or PowerShell` が出て、`Get-Clipboard` は拒否のトーストが出すのと同じ `cmd /d /c mklink /J "<リンク>" "<フォルダ>"` の 1 行だけ。それを filer のペイン（`<C-t>`、PowerShell）に貼るとジャンクションができる（v0.72.6。それまでは素の `mklink` がそこで認識されなかった、#193）'''
"13.9" = '`y` してから、**隣の**ディレクトリで `_` → 同じリンクが相対パス（`..\other\file`）で作られる。`g`+`f` で追え、両方のディレクトリを一緒に移動しても壊れない（これが `-` に対する `_` の利点）'
"13.10" = 'シンボリックリンクの上で `<Tab>` → **Link** セクションが出る。`Kind` が `Symlink`、`Target` が保存されたパス、`Resolves` が実際の着地点'
"13.11" = '`_` で作ったリンクの上で `<Tab>` → `Kind` が `Symlink (relative)`。`Target` は相対パス、`Resolves` は絶対パスで、**2 行が食い違うことがこの対の要点**'
"13.12" = '**壊れた**リンクの上で `<Tab>` → `Resolves` が `no (…)` と OS の理由を出し、セクション自体は表示される'
'13.12a' = '''RAM ディスクへのジャンクション（`R:\cargo-target\filer` を指す `C:\dev\filer\target`）の上で `<Tab>`（v0.73.27）→ `Resolves` が `R:\cargo-target\filer (as written: this volume cannot normalize it, … (os error 1))` と出て、`no (…)` にならない。リンクは生きていて、ボリュームが最終的なパスを返せないだけ。以前は `no (…os error 1)` と、壊れたリンクと同じ見た目だった'''
"13.13" = 'ハードリンクの上で `<Tab>`（`=` か `fsutil hardlink create` で作る）→ `Kind` が `Hardlink`、`Links` が `2`。**アプリ内でハードリンクが見えるのはここだけ**'
"13.14" = '同じものを Windows で → `Also at` に別名のパスが並ぶ。`fsutil hardlink list` と突き合わせる（自分自身のパスを除いた同じ集合になる）'
"13.16" = 'ハードリンクを作り、別のプログラムに共有なしの書き込みロックを握らせた状態で `<Tab>`（コマンドは上の「準備」）→ `Links` は `2` のまま、`Also at` も出る。ハンドルがアクセス権を一切要求しないので、排他ロックでも数えられる'
'13.17' = '''ジャンクション（`mklink /J`）で `<Tab>`（v0.59.4）→ `Kind` が `Symlink` ではなく `Junction`。同じフォルダへのシンボリックリンク（`mklink /D`）は今までどおり `Symlink`。一覧の `->` はどちらも変わらない（13.7）'''
"47.1" = "ファイルとサブフォルダのあるフォルダで filer を開き、10 秒何も触らない。`(Get-Process filer).CPU` を 10 秒あけて 2 回読む → 2 つの差は **1 秒よりずっと小さい**（100 分の数秒なら普通）"
'47.2' = '''最後のサブフォルダから `j` で最初のファイルに乗り、すぐ（40 ms のデバウンスの内に）`k` でサブフォルダに戻って手を離す。CPU を 10 秒あけて 2 回読む。既定ではフォルダが上に並ぶ（`sort_dir_first`）ので、ファイルから `j` ではフォルダに乗れない → 同じく**増えない**。v0.54.2 より前は、これが描き続けたまま止まらなくなる手順だった'''
"47.3" = "47.2 のあと窓を最小化する → 最小化していても増えない"
"47.4" = "47.1〜47.3 でまだ増えるとき: `Get-Process filer \\| % Threads \\| sort TotalProcessorTime -desc \\| select -first 3 Id, TotalProcessorTime` を 10 秒あけて 2 回 → どのスレッドの時間が増えるかと、分かれば開始アドレスを報告する。次に調べるのはそのスレッド"
'47.5' = '''`f` のプロンプトを開いて 10 秒何も触らず、前後で CPU を読む（v0.59.3）→ プロンプトを開いていないとき（47.1）と同じく増えない。キャレットは点滅せず常に出ている。v0.59.3 までは点滅のために毎秒 2 回描いていて、10 秒で 0.14〜0.30 CPU 秒（#103、#110）'''
"47.6" = '`filer.toml` に `[ui] backend = "gl"`、`WGPU_BACKEND` は無しで起動し、47.1 をする（v0.74.0、Q70）→ `filer env` の `Adapter` の行が `(Gl, …)` で終わり、Vulkan と DX12 では通らなかった 47.1 が通る（x64 の AMD の機械）'
"47.7" = '`[ui] backend = "directx"`、次に Windows で `"metal"`（v0.74.0、Q70）→ どちらも窓は開き、`auto` と同じに描く（GL のある機械では `Adapter` が `(Gl, …)`。v0.75.5。以前は Vulkan で、x64 の AMD の機械ではまた 1 コアを使った）。設定の警告が `"directx" is not one of auto, vulkan, dx12, metal, gl`、次に `"metal" is macOS only`（v0.74.8）と言う。`filer env` の `Warnings` の行も 2 回とも同じことを言い、`Backend` の行は `[ui] backend = "directx"`。窓のトーストは、何で描いたかを `drawing with Gl instead` と言って終わる（v0.75.6）。`filer env` は `drawing with the default` のまま'
"47.8" = '`[ui] backend` も `WGPU_BACKEND` も無しで起動し、次に `backend = "vulkan"`（Windows、v0.75.0）→ `filer env` の `Adapter` が 1 回目は `(Gl, …)`、2 回目は `(Vulkan, …)` で終わり、どちらも警告は出ない。x64 の AMD の機械では、何も書かずに 47.1 が通る'
"48.1" = '展開した各フォルダで `Get-ChildItem -Recurse` → フォルダが 1 つ（`filer-<タグ>-windows-x64` か `-arm64`）で、中はちょうど 5 ファイル: `filer.exe`、`filer.com`（v0.71.0）、`conpty.dll`、`OpenConsole.exe`、`ConPTY-LICENSE.txt`。他には何も無く、フォルダの横にも何も無い'
"48.2" = '各フォルダで `.\filer.exe --version` → x64 の zip は `filer <版> (x86_64)`、ARM64 の zip は `filer <版> (aarch64)`。版はタグから `v` を除いたもの'
"48.3" = '各 zip の 4 つのバイナリ（v0.71.0 から `filer.com` も）の PE machine（節の冒頭の式）→ x64 の zip は 4 つとも `8664`、ARM64 の zip は 4 つとも `AA64`。混ざっていたらこの行が探している不具合（ARM64 版に x64 の ConPTY が入ると、起動はしてペインでおかしくなる）'
"48.4" = '`ConPTY-LICENSE.txt` を読む → リリースのコミットの `scripts/fetch-conpty.ps1` が固定している版（`$version`）が書いてあり、`{VERSION}` が残っていない'
"48.5" = '各 zip と展開した各ファイルに `Get-FileHash -Algorithm SHA256` → リリースページ末尾の **SHA-256** の表の、そのファイルの行と全部一致する。表が無ければ `sums` ジョブが動かなかったということなので、そう書く'
'48.6' = '''間違いを見つけられるように、先に別の `conpty.dll` を `PATH` に置く。確かめる `filer.exe` と**同じ PE machine** のもの（48.3 の 1 行で読める）。WezTerm のものは `8664` で、ARM64 のプロセスにはそもそも読み込めないので、それでは ARM64 の zip の半分は何も確かめていない（#199）。そのうえで各フォルダの `filer.exe` を起動してペインを開き（`<C-t>`）、プロセスのモジュールを見る: `(Get-Process filer).Modules \| ? ModuleName -eq conpty.dll \| % FileName` → フルパスが **そのフォルダの** `conpty.dll`（`filer.exe` と同じフォルダ）。zip はそのためにある。間違っているときに出るのは別のアプリ（WezTerm など）のもので、`C:\Windows` の下ではない。Windows に `conpty.dll` は無い（v0.70.3、#151 / #184）'''
'48.7' = '''`filer.exe` **だけ**を空のフォルダに写す。別のフォルダに `conpty.dll` と `OpenConsole.exe`（zip のもの）を置いてそこへ `cd` し、その exe をフルパスで起動、`<C-t>`、48.6 と同じくモジュールを見る。`conpty.dll` の無いフォルダから、`PATH` のどこかに `conpty.dll` がある状態でもう一度（v0.70.3、#184）→ どちらでもモジュールに `conpty.dll` が**無い**: ペインは Windows 標準の ConPTY で動く。v0.70.3 より前は、1 回目は作業フォルダの、2 回目は `PATH` のものを読み込んでいた'''
