"1.24" = "ペインの中で全画面 TUI を走らせる（`gh dash`、または `lazygit`）（v0.48.2） → ちゃんと描ける。代替画面・色・罫線・TUI 自身の分割ペイン。**一度は見えている**ので、この行はそれを見続けるためのもの"
"1.25" = "その TUI を操作して、抜ける（`j` / `k` で移動、`q` で終了） → キーが届き、抜けるとペインが返ってきてプロンプトが使える。**描けることと操作できることは別の主張で、1.24 が通ってもこちらは何も言えない。**抜けられない TUI はペインを道連れにする"
"1.26" = "ペインを開いた状態で `<C-S-Enter>`（v0.48.4） → ペインが**上端まで**窓を取る。ヘッダも一覧も無く、下にステータスバーだけ。高さの 3 分の 1 はシェルには妥当で、全画面のプログラムには足りない"
