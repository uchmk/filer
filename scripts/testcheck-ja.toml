[row]
# 1. ターミナルペイン
"1.1" = '`<C-t>` を一覧から押す → 下部にシェルが開き、一覧が表示しているディレクトリに既にいる'
"1.2" = '`dir` と打って Enter → 出力が一覧と同じフォントで、桁が揃い、字が重ならない'
"1.3" = 'カーソルを見る → シェルのカーソル位置が四角く塗られ、打つと動く'
"1.3a" = '`<C-t>` でキーを一覧に戻す → カーソルが**中抜き**になり、ペイン上端の線は枠の色のまま（フォーカスで緑にならない）'
"1.4" = '色の出るものを実行（`repo` の中で `git status`）→ ANSI 16 色が出て、**一覧自身の配色と一致**する（別パレットに見えない）'
"1.5" = '**もう一度 `<C-t>`** → キーが一覧に戻り、**シェルは生きたまま**出力も残っている（v0.6.0 の修正。以前はここでシェルが終了していた）'
"1.6" = '`<C-t>` を何度か往復 → 同じシェルのまま。スクロールバックが消えない'
"1.7" = '`<C-S-t>` → **ここで**ペインが閉じ、シェルが終了する'
"1.8" = '開き直してウィンドウをリサイズ → 桁が組み直される。半端に切れた列も、引き伸ばされた字も無い'
"1.9" = '`many\` で `dir` して画面を埋め、`<S-PageUp>` → **本文が動く**（v0.20.3 まで注記だけが動き、スクロールしていない画面に「N 行前」と出ていた）'
"1.9a" = '`<S-PageUp>` / `<S-PageDown>` → 半画面ずつ戻る / 進む（v0.20.4 まで符号が逆で、`<S-PageUp>` が下を向いて何も起きなかった）'
"1.9b" = '`<S-Home>`、`<S-End>` → 最古の行と、プロンプト'
"1.9d" = 'ペインの上でホイール → 1 ノッチずつ滑らかに動く（以前は 1〜2 行動かすのに強く回す必要があった）'
"1.9e" = 'プロンプトが画面から出るまで戻る → カーソルも一緒に消える（元の高さに四角が取り残されない）'
"1.9c" = '`<C-S-f>` でスクロールバックのずっと上にある語を検索、Enter → そこへ飛び、**一致箇所が強調される**'
"1.9f" = '`<C-S-f>` で**いま画面に出ている**語を検索 → 履歴の古いほうではなく、画面のものが先に見つかる'
"1.9g" = 'そのあと `<C-S-n>` / `<C-S-b>` → `<C-S-n>` で履歴の上へ、`<C-S-b>` で下へ戻る'
"1.9h" = '`<C-S-f>` で存在しない語を検索 → 赤いトーストで「無い」と言う（無反応ではない）'
"1.10" = '`<S-End>` のあと何か 1 文字打つ → 最下部に戻る。打つだけでも戻ることの確認'
"1.11" = '出力の上をドラッグ → **ドラッグ中から選択が描かれ**、離すとクリップボードに入る（v0.20.4 まではコピーは効くのに何も描かれなかった）'
"1.11a" = '同じ範囲を**右から左へ**ドラッグ → 1 文字も違わず同じ文字列（v0.26.4 まで逆向きは**両端で 1 文字ずつ**落ちていた）'
"1.11b" = '最初の文字の**左の隙間ではなく、文字の上から**ドラッグを始める → その文字が含まれる（以前は隙間から始めないと落ちた）'
"1.11c" = '文字の**右半分**からドラッグを始める → その文字は含まれない（これが正しく、1.11a が成り立つのと同じ規則）'
"1.12" = '単語をダブルクリック → 単語が選択され、それが目に見える'
"1.13" = '`<C-S-f>` でスクロールバックの語を検索、Enter、そのあと `<C-S-n>` → 次々に移動でき、末尾で先頭に回り込む'
"1.14" = 'ターミナルの中で `<F1>` → キー一覧がターミナルの**上に**開く。`<Esc>` で閉じ、入力がシェルに戻る'
"1.15" = 'ターミナルの中で `<C-S-p>` → コマンドパレットが開き、そこから実行できる'
"1.16" = 'シェルで `cd` してから `<A-Up>` → 一覧がシェルのいる場所へ追従する'
"1.17" = '2 つ選んで `<A-t>` → パスが引用符付きでシェルの行に打ち込まれる。**実行はされない**'
"1.18" = 'OSC 7 を報告するシェル（PowerShell 7、または `PROMPT_COMMAND` を設定した bash）で、一覧側のディレクトリを変える → シェルに余計な `cd` が打ち込まれない'

# 2. ミニマップ
"2.2" = '形を見る → コメント見出しが長い帯、インデントされた塊は右から始まる帯、40 行ごとの空行が隙間。**元のファイルの形に見えること**'
"2.3" = '色を見る → 帯に構文色が乗っている（文字列とコメントがコードと違う色）。単色の塗りつぶしではない'
"2.4" = 'ビューポートの枠を探す → 画面に出ている範囲を覆う、明るめの枠線付きの箱がある'
"2.5" = '`<A-j>` を数回 → 箱が本文と同じだけ下がる'
"2.6" = '帯の中ほどをクリック → プレビューがそこへ飛び、**クリックした行がペインの中央**に来る（上端ではない）'
"2.7" = '帯の上を上下にドラッグ → プレビューが連続して追従する'
"2.9" = '`<A-n>` → ミニマップが消え、もう一度で戻る'
"2.10" = '`notes.md` を（レンダリング表示で）開く → **ミニマップは出ない。**これは意図的で、描画された行はファイルの行と一致しないため'
"2.11" = '`M` でソース表示にする → ミニマップが出る'
"2.12" = '短いファイル（`same-a.txt`）→ 出ない。2 行を地図にしても意味がない'

# 3. 画像の拡大と移動
"3.1" = '`zoom-me.png` をホバー → ペインに収まる。説明に `3200 × 2400 · fit NN%` と出る'
"3.2" = '`<A-1>`（等倍）→ ペインよりはるかに大きくなり、中央部分が見える。**グリッド線がくっきりしている**こと（再デコードが効いている証拠。収めた画像を引き伸ばしたぼけた絵なら、それがこの機能の避けたかったバグ）'
"3.3" = 'くっきりする瞬間を見る → **画像が飛んだり大きさが変わったりしてはいけない。**変わるのは鮮明さだけ'
"3.4" = 'ドラッグする → 移動でき、端がペインの端に来たら止まる。画面外へ放り出せない'
"3.5" = 'グリッドの交点にポインタを置いて `Ctrl`+ホイール → **ポインタを中心に**拡大縮小し、カーソル下の交点がその位置に留まる'
"3.6" = 'Ctrl 無しのホイール → ペインがスクロールする。拡大はしない'
"3.7" = 'ダブルクリック → 収まる大きさに戻り、中央に来る'
"3.8" = '`<A-i>` / `<A-o>` → 段階的に拡大縮小。説明のパーセント表示も追従する'
"3.9" = '拡大してから `j` で次のファイルへ行き、戻る → また収まった状態になっている（拡大率はファイルごとのもの）'
"3.10" = '`tiny.png`（48×48）をホバー → 元の大きさのまま表示される。**ペインを埋めるように引き伸ばされない**'

# 4. SVG と、その中の文字
"4.1" = '文字の入っていない SVG（アイコンやロゴ）をホバー → 描画され、ペインに合わせて拡大され、どの大きさでもくっきりしている'
"4.2" = '**文字の入った** SVG → 文字が正しい位置に正しい大きさで描かれる。**消えていない・豆腐になっていない・重なっていない**'
"4.3" = '**日本語**の入った SVG → 同じ。かなと漢字のあるフォントが選ばれる（文字が消えない）'
"4.4" = '**インストールされていない**フォントを指定した SVG → 代替フォントが使われて読める形で出る。描画全体が失敗しない'
"4.5" = '**太字**や*斜体*の文字が入った SVG → 太さと傾きが反映される（普通の字に潰れない）'
"4.6" = 'システムフォントではなく**隣に置いたフォントファイル**を使う SVG → そのディレクトリから読まれる（`resources_dir` の意図どおり）'
"4.7" = '**壊れた** SVG（途中で切ったもの）→ プレビューに `bad SVG: …` と出て、ウィンドウは動き続ける'
"4.8" = '4.2 と 4.3 を v0.33.5 のビルドと見比べる → 字形の違いがあれば新しいシェイパーの影響。何が変わったかを書いて両方添える（**v0.33.5 のビルドが要るので、無ければ飛ばす**）'

# 7. ヘルプパネルの設定ファイルパス
"7.1" = 'どこにも `filer.toml` が無い状態で `~` → **両方の**ディレクトリが並び、空のほうに `nothing here` が付く（v0.25.0 までは存在するファイルしか出なかった）'
"7.2" = 'パスの行をホバー → 行が光り、ポインタが手の形になる'
"7.3" = 'キーの行をホバー → 何も起きない。そこはリンクではない'
"7.4" = '設定**ファイル**をクリック → パネルが閉じ、そのファイルにカーソルを置いた状態でディレクトリが開く。`<Enter>` でそのまま開ける'
"7.5" = '**ディレクトリ**をクリック → パネルが閉じ、空でもそこへ移動する'
"7.6" = '空のほうをクリックし、そこに `filer.toml` を作って `<C-F5>` → 次に開いたとき `nothing here` が消えている'
"7.7" = '`YAZI_CONFIG_HOME` / `FILER_CONFIG_HOME` を設定した状態で → 並ぶディレクトリがそれに従う'
"7.8" = '設定の警告行 → 黄色のまま。クリックできない'

# 8. ターミナルペインが起動するシェル
"8.1" = '`filer.toml` に `[term]` が無い状態で `<C-t>`、`$PSVersionTable.PSVersion` → `5.1.x`（Windows PowerShell。以前の版から変わっていない）'
"8.2" = '`[term]` / `shell = "pwsh"` を足して `<C-S-t>` → `<C-t>` → もう一度聞く → `7.x`'
"8.3" = 'それぞれで `$PROFILE` → 別のパスが出る（5.1 は `WindowsPowerShell\`、7 は `PowerShell\`）'
"8.4" = 'OSC 7 のフックを pwsh のプロファイルにだけ入れて、それぞれで `cd` して `<A-Up>` → pwsh では追従し、5.1 ではその旨が出る。**この非対称そのものが報告の中身**'
"8.5" = '`args = ["-NoLogo"]` → 起動時のバナーが消える'
"8.6" = 'インストールされていない `shell` を指定 → 起動に失敗し、その旨が出る（無言の空ペインにならない）'
"8.7" = '`[term]` を消して `<C-S-t>` → `<C-t>` → 既定に戻る'

# 14. 親ディレクトリの列
"14.1" = 'そこの**ディレクトリ**をクリック → 従来どおり中へ入る'
"14.2" = 'そこの**ファイル**をクリック → そのファイルのある階層まで上がり、**カーソルがそのファイルに乗る**（v0.26.7 までは何も起きなかった）'
"14.3" = 'そのあと `<Enter>` → 開く。カーソルが「近く」ではなく本当にそのファイルに乗っている確認'
"14.4" = 'どちらかをダブルクリック → シングルクリックと同じ。2 つ目の別の意味は無い'
"14.5" = 'いま自分がいるディレクトリの行をクリック → その場に留まり、カーソルが飛び回らない'
"14.6" = 'ドライブ直下（親の列が無い場所）で → クリックするものが無く、何もおかしくならない'

# 15. ウィンドウの拡大縮小
"15.1" = '何かヤンクした状態で `<C-->` → **ウィンドウが縮むだけ。**v0.32.0 まではハードリンクも同時に作っていた（1 打で 2 動作）'
"15.2" = '`<C-+>` と `<C-=>` → どちらでも大きくなる。どちらに shift が要るかは配列次第（US は `+` が shift+equals、JIS は `+` が shift+semicolon で `=` が shift+minus）。**両方の綴りが割り当ててあるのでどちらからでも届く**（v0.45.6）'
"15.3" = '`<C-0>` → 100% に戻り、トーストがそう言う'
"15.4" = '`<C-->` を押しっぱなし → 滑らかに縮んで 20% で止まる。`<C-+>` の押しっぱなしは 500% で止まる'
"15.5" = '何かヤンクした状態で、**同じドライブ内の**ディレクトリで `=` → ハードリンクができる。**一覧の行には印が出ない**（ハードリンクは同じ実体を指す別のエントリなので、区別する印が無い）。v0.46.0 以降は **`<Tab>` の spot パネルに出る**（`Kind: Hardlink` / `Links: 2`。それが 13.13）。外から確かめるなら `fsutil hardlink list <新しいパス>`。**ドライブを跨ぐと失敗するのが正しい**（NTFS のハードリンクはボリュームを跨げない）'
"15.6" = '画像の上で `<A-i>` / `<A-o>` → **画像の**拡大縮小のまま影響を受けない（`zoom` と `scale` は別のコマンド）'
"15.7" = '`~` → `scale in` / `scale out` / `scale reset` が他のコマンドと同じように並んでいる'

# 13. シンボリックリンク
"13.7" = 'ジャンクション（`mklink /J`）で試す → シンボリックリンクと同じ扱い（名前の後ろに `->` が付き、`g`+`f` で追える）'
"13.8" = '`y` してから、別のディレクトリで `-` → シンボリックリンクができる。**Windows では開発者モードが要る**（設定 > システム > 開発者向け）。無いと `os error 1314` で失敗し、トーストが対処法を 2 つ示す'
"13.9" = '`y` してから、**隣の**ディレクトリで `_` → 同じリンクが相対パス（`..\other\file`）で作られる。`g`+`f` で追え、両方のディレクトリを一緒に移動しても壊れない（これが `-` に対する `_` の利点）'
"13.10" = 'シンボリックリンクの上で `<Tab>` → **Link** セクションが出る。`Kind` が `Symlink`、`Target` が保存されたパス、`Resolves` が実際の着地点'
"13.11" = '`_` で作ったリンクの上で `<Tab>` → `Kind` が `Symlink (relative)`。`Target` は相対パス、`Resolves` は絶対パスで、**2 行が食い違うことがこの対の要点**'
"13.12" = '**壊れた**リンクの上で `<Tab>` → `Resolves` が `no (…)` と OS の理由を出し、セクション自体は表示される'
"13.13" = 'ハードリンクの上で `<Tab>`（`=` か `fsutil hardlink create` で作る）→ `Kind` が `Hardlink`、`Links` が `2`。**アプリ内でハードリンクが見えるのはここだけ**'
"13.14" = '同じものを Windows で → `Also at` に別名のパスが並ぶ。`fsutil hardlink list` と突き合わせる（自分自身のパスを除いた同じ集合になる）'
"13.16" = 'ハードリンクを作り、別のプログラムに共有なしの書き込みロックを握らせた状態で `<Tab>`（コマンドは上の「準備」）→ `Links` は `2` のまま、`Also at` も出る。ハンドルがアクセス権を一切要求しないので、排他ロックでも数えられる'
