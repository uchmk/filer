"41.14" = '遅いネットワークドライブ上のフォルダで `<Tab>` → パネルはカーソルに追従し続ける（spot ワーカーは newest-wins）'

# 43. CSV / TSV を表として
"43.9" = '50MB の CSV → すぐ開き、`max_text_bytes` で切られ、フッタが省略したと述べる'

# 44. ディスク使用量
"44.1" = '`node_modules` のあるプロジェクトで `gu` → 子が大きい順に棒付きで並ぶ。`node_modules` が上位に来て、合計が自身のエントリよりはるかに大きい'
"44.2" = '`gu` してから `<Esc>` → 元のディレクトリに戻り、カーソルも元の位置。走査は止まる（抜けたあと CPU を使わない）'
"44.3" = '30 万ファイル超のツリーで `gu` → 完了し、走査を打ち切ったことと合計が下限値であることを述べる'
"44.4" = '`.gitignore` された `target/` や `build/` を含むフォルダで `gu` → **数に入る**（除外されない）'
"44.5" = '容量の大半を隠しフォルダが占める場所で `gu` → 数に入り、表示もされる'
"44.6" = '大きなツリーへのシンボリックリンク / ジャンクションを含むフォルダで `gu` → リンクは 1 エントリ扱いでツリーの二重計上にならず、固まらない'
"44.7" = '`C:\` で `gu` → 答えが出る。上位のフォルダが WizTree やエクスプローラーの表示と見比べて妥当'
"44.8" = 'ネットワーク共有（UNC）で `gu` → 答えるか、穏当に失敗する。走査の途中でも `<Esc>` で抜けられる'
"44.9" = '`gu` のあと `j`/`k`、`y`、`d`、スペースで選択 → 通常の一覧キーが全部効く。**パネルではなく一覧そのもの**だから'
"44.10" = '`gu` のあとフォルダで `Enter` → 普通の移動（ビューを抜けてフォルダに入る）。そこでもう一度 `gu` すればそこから測り直す'
"44.11" = '使用量ビューを開いたまま `gu` → メッセージを添えて断られる（戻れないビューにならない）'
"44.12" = '`gu` のあと `,` で並べ替え直す → 指示どおり順序が変わる。もう一度 `gu` すれば大きい順に戻る'
"44.13" = 'フォルダの合計をエクスプローラーのプロパティと比べる → 丸め誤差の範囲で一致。**ハードリンクは多めに出るが、それは仕様として文書化してある**'

# 45. 2 つのフォルダを比べる
"45.3" = '`n` / `N` → `=` でない行の間を歩き、一致した行は飛ばす。末尾ではその旨を述べる'
"45.4" = '`gg` / `G` → 最初の行と最後の行'
"45.6" = '最後の 1 バイトだけが違うファイルを含むツリー → その行が `=` ではなく `~` になる'
"45.8" = '片方ではフォルダ、もう片方では同名のファイル → `~`'
"45.9" = 'ファイル 1 つとフォルダ 1 つを選んで `<A-d>` → `compare two files, or two folders — not one of each` と断られる'
"45.10" = '`node_modules` 同士（10 万パス超）→ 答えが出るか、打ち切ったと述べる。ウィンドウは固まらない'
"45.11" = 'シンボリックリンクの指す先だけが違う 2 つのツリー → そのリンクの行が「異なる」と読める'
"45.12" = '2 分割して各ペインでフォルダの上に立ち、`<A-d>` → その 2 つが比較される'
"45.13" = '`q` / `<Esc>` → 閉じる。そして 2 つの**ファイル**はこれまでどおり行単位で比較できる'

# 46. spot パネルの Git セクション
"46.1" = 'コミット済みのファイルで `<Tab>` → **Git** セクションが出る。`Last change` が短いハッシュと `YYYY-MM-DD HH:MM`、続いて `Subject` と `Author`'
"46.2" = '`git log -1 -- <そのファイル>` と突き合わせる → 同じコミット。リポジトリの最新ではなく、**そのパスに触れた最新のもの**'
"46.3" = '複数のコミットが触れたファイルで `<Tab>` → `Commits` が件数付きで出る'
"46.4" = 'ちょうど 1 つのコミットで追加されたファイルで `<Tab>` → **`Commits` の行が出ない。**1 件では日付以上のことを言っていないため'
"46.5" = 'そのパスに触れたコミットが 50 件以上ある履歴のファイルで `<Tab>` → `Commits` が `50+` と出る（間違った合計ではない）。ルート近くのディレクトリで履歴全部ではなく 1 ページ分だけ読むための上限'
"46.6" = '**ディレクトリ**で `<Tab>` → その中の何かに触れた最後のコミット'
"46.7" = '新規で未コミットのファイル（`git status` で `?`）で `<Tab>` → **Git セクションが出ない。**履歴の中に触れたものが無いため'
"46.8" = 'リポジトリでない場所で `<Tab>` → Git セクションが出ず、パネルの描画前に待ちも発生しない'
"46.9" = '`git` が `PATH` に無い機械で同じこと → Git セクションが出ず、エラーも出ず、パネルの他の部分にも影響しない'
"46.10" = '最後のコミットの件名に日本語や絵文字が入っているファイルで `<Tab>` → 文字化けせずそのまま描かれる（書式が NUL 区切りなので引用が要らない）'
"46.11" = 'コンソールの窓が出ないか見張る → **一瞬も出ない。**`git` は status ワーカーと同じく `CREATE_NO_WINDOW` で起動される'

# 13. シンボリックリンク
"13.7" = 'ジャンクション（`mklink /J`）で試す → シンボリックリンクと同じ扱い（名前の後ろに `->` が付き、`g`+`f` で追える）'
"13.8" = '`y` してから、別のディレクトリで `-` → シンボリックリンクができる。**Windows では開発者モードが要る**（設定 > システム > 開発者向け）。無いと `os error 1314` で失敗し、トーストが対処法を 2 つ示す'
"13.9" = '`y` してから、**隣の**ディレクトリで `_` → 同じリンクが相対パス（`..\other\file`）で作られる。`g`+`f` で追え、両方のディレクトリを一緒に移動しても壊れない（これが `-` に対する `_` の利点）'
"13.10" = 'シンボリックリンクの上で `<Tab>` → **Link** セクションが出る。`Kind` が `Symlink`、`Target` が保存されたパス、`Resolves` が実際の着地点'
"13.11" = '`_` で作ったリンクの上で `<Tab>` → `Kind` が `Symlink (relative)`。`Target` は相対パス、`Resolves` は絶対パスで、**2 行が食い違うことがこの対の要点**'
"13.12" = '**壊れた**リンクの上で `<Tab>` → `Resolves` が `no (…)` と OS の理由を出し、セクション自体は表示される'
"13.13" = 'ハードリンクの上で `<Tab>`（`=` か `fsutil hardlink create` で作る）→ `Kind` が `Hardlink`、`Links` が `2`。**アプリ内でハードリンクが見えるのはここだけ**'
"13.14" = '同じものを Windows で → `Also at` に別名のパスが並ぶ。`fsutil hardlink list` と突き合わせる（自分自身のパスを除いた同じ集合になる）'
"13.16" = 'ハードリンクを作り、別のプログラムに共有なしの書き込みロックを握らせた状態で `<Tab>`（コマンドは上の「準備」）→ `Links` は `2` のまま、`Also at` も出る。ハンドルがアクセス権を一切要求しないので、排他ロックでも数えられる'
