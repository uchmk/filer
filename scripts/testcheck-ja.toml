"4.2" = '**文字の入った** SVG → 文字が正しい位置に正しい大きさで描かれる。**消えていない・豆腐になっていない・重なっていない**'
"4.3" = '**日本語**の入った SVG → 同じ。かなと漢字のあるフォントが選ばれる（文字が消えない）'
"4.4" = '**インストールされていない**フォントを指定した SVG → 代替フォントが使われて読める形で出る。描画全体が失敗しない'
"4.5" = '**太字**や*斜体*の文字が入った SVG → 太さと傾きが反映される（普通の字に潰れない）'
"4.6" = 'システムフォントではなく**隣に置いたフォントファイル**を使う SVG。`font-family` はファイルの中のファミリー名にする（v0.73.54）→ 文字がそのフォントで描かれ、Times に落ちない。filer は SVG と同じフォルダ（その下は見ない）の `.ttf` / `.otf` / `.ttc` / `.otc` を読む。`@font-face` の `url()` はたどらないので、合うのはファミリー名'
"4.7" = '**壊れた** SVG（途中で切ったもの）→ プレビューに `bad SVG: …` と出て、ウィンドウは動き続ける'
"4.8" = '4.2 と 4.3 を v0.33.5 のビルドと見比べる → 字形の違いがあれば新しいシェイパーの影響。何が変わったかを書いて両方添える（**v0.33.5 のビルドが要るので、無ければ飛ばす**）'
"4.9" = '大きさの分かる SVG（100 × 100 に半径 40 の円）で `<A-i>` を 1 回押して 2 秒待つ。次に `<A-1>`（v0.73.53、#219）→ `<A-i>` で 1 段（1.25 倍）大きくなり、そこで止まる。v0.73.53 より前は、くっきり描き直すたびに収まる倍率が下がり、4096 px の上限まで大きくなり続けた。`<A-1>` は SVG 自身の大きさを論理ピクセルで出す。ブラウザーと同じ大きさ（画面の倍率 100% なら円の直径 80 px、150% なら 120 px。v0.73.62、Q65）で、注記は `· 1:1`、`zoom: 100%`'

