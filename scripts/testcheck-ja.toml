"25.15" = '`yazi.toml` を壊して Warnings の行を読む → パスが **`…\filer\yazi.toml`** と、すべて円記号で書かれている。以前は `…\filer/yazi.toml` と出ていた —— **編集すべきファイルを指し示すのが仕事のメッセージなのに、そこが壊れていた**（v0.33.12）'
"25.16" = "ファイルのあるフォルダで `filer <フォルダ> --keys \"<Tab>C\"`、続けて `Get-Clipboard`（v0.54.0）→ 窓が開き、spot が勝手に先頭の行で開き、クリップボードにパネル全体が `ラベル<TAB>値` の行で入っている。`Name` と `Path` がその先頭の行を指している"
"25.17" = "`filer --keys \"<Tab\"` と `filer --keys \"<Bogus>\"` → **窓は開かない。**問題を言う 1 行（`has no closing >` / `is not a key`）と、終了コード 2"
"25.18" = "release ビルドで `filer env \\| Out-File out.txt` と `Get-Content out.txt`、それと `cmd /c \"filer env > out2.txt\"`（v0.54.4）→ レポート全体が**両方のファイルに入り**、画面には何も出ない。v0.54.4 より前はどちらも空だった。（PowerShell 自身の `filer env > out.txt` は今も空になる。PowerShell が窓のアプリの出力をファイルにつながないため。README にそう書いた）"
'25.19' = '''`filer env \| Select-String "arch\s+:"`（ただの `arch` だと、オープナーなどの `Archive` を含むパスにも当たる）→ **arch の 2 行だけ**が出る（Windows。それ以外は `Process arch` の 1 行）（レポート全体ではない）'''
"25.19a" = "PowerShell で `$v = & filer env \\| Write-Output; $v.Count`（v0.67.26、Q54）→ レポートの行数で、0 ではない。**後ろに何も置かない** `$v = & filer env` だと、PowerShell はパイプラインの最後にある窓のプログラムを待たず、`$v` は空になる。filer ではなく PowerShell の動き（#183）なので、行には `\\| Write-Output` を付けてある"
"25.19b" = "PowerShell で、パスに日本語を含むフォルダから `filer env --out out3.txt`、続けて `Get-Content -Encoding utf8 out3.txt`（v0.68.0、Q55）→ `filer: wrote <フルパス>` の 1 行が出て、ファイルにレポート全体が入り、日本語がコンソールのコードページに関係なく**読める**。`filer env --out`（名前なし）と `filer env --outt x` は問題を 1 行で言い、終了コード 2 で、何も書かない"
'25.19c' = '''zip のフォルダを `PATH` に入れた状態で（v0.71.0、Q44）: `(Get-Command filer).Source`、`$v = & filer env; $v.Count`、`filer --version > v.txt; Get-Content v.txt`、`filer --keys "<Tab"; $LASTEXITCODE`、最後に `filer` だけ → `Source` は `filer.com` で終わる。行数は**後ろに何も置かない**形（25.19a から `Write-Output` を除いた形）でレポートの行数になる。`v.txt` に版の行が入る。拒否は 1 行出て `$LASTEXITCODE` が 2。`filer` だけなら窓が開き、窓が開いたままプロンプトが戻る'''
'25.19d' = '''zip のフォルダを `PATH` に入れ、`filer` の 1 行だけの `w.ps1` を作って `pwsh -File w.ps1 | Tee-Object t.txt; "back"`（v0.73.6、#192）。次に `w.ps1` を `filer C:\dev C:\Windows` にして同じことをする → 窓が開き、**窓を開いたまま** `back` が出る（以前は窓を閉じるまでパイプラインが終わらなかった）。2 つのパスでは窓が出ず、拒否の 1 行が画面に出て `t.txt` にも入る'''
'25.19e' = '''空のフォルダで `pwsh -File` から走らせる `.ps1` の中で（v0.73.8、#188）: `filer env --out a.txt; Test-Path a.txt; $LASTEXITCODE`、次に `& <zip のフォルダ>\filer.exe env --out b.txt | Out-Null; Test-Path b.txt`、次に `& <zip のフォルダ>\filer.exe env --out | Out-Null; $LASTEXITCODE`。それと `filer --help` → `True` と `0`、次に `True`、次に `2`。README の待ち方が `filer.com` でも `filer.exe` でも効く。`--help` の `env --out FILE` の下に `(filer.exe in a script: add | Out-Null to wait)` がある'''
"25.21" = '`filer env`（v0.58.1）→ 答えた `.exe` のフルパスを `Executable` の行に出す。ARM64 の機械では、**x64** ビルドの `Process arch` が `x86_64 (emulated on aarch64)`、ARM64 ビルドは `aarch64` だけ'
'25.23' = '''ペインを開いて `<C-S-Enter>`、filer を閉じてから `filer env`（v0.59.4）→ `Last run` の下に `Terminal pane` の行があり、最後の大きさを `N x M (lines x columns)` で出す。ペインを一度も開かなかった run の後は `not opened in that run`'''
'25.24' = '''どこかのフォルダのシェルから `filer .`、次に `filer ..`、次に引用符なしで `filer two words`（v0.59.5）→ `.` はそのフォルダを開き、タイトルが**絶対**パスで親の列があり、`h` で上がれる。`..` は 1 つ上を開く。引用符なしの 2 語は窓を開く前に `filer: more than one path: "two" and "words" (a path with a space in it needs quotes)` と断られる'''
'25.24a' = '''PowerShell から引用符なしで `filer C:\dev C:\Windows`（v0.73.5、#194）→ 窓を開く前に断られ、パスは打ったとおり: `filer: more than one path: "C:\dev" and "C:\Windows" (a path with a space in it needs quotes)`。`\` は 1 つずつ。以前は `\` が全部二重に出た（`"C:\\dev"`）。Linux では `filer 'a\b' c` が同じように `"a\b"` と出す'''
'25.25' = '''オープナーでファイルを開き（`<Enter>` か `<S-Enter>`）、`;` のシェルを 1 つ走らせ、filer を閉じてから `filer env`（v0.59.9）→ `Last run` の下の `Launched` の行に、filer が組み立てたとおりのコマンド行が 2 つ、新しいものが後で、最大 5 つ並ぶ。何も起動しなかった run の後は `nothing in that run`'''
'25.22' = '''`FILER_PTY_LOG` を設定して `filer --keys "<C-t><Wait:2000>echo<Space>hi<Enter><Wait:1000><C-S-Enter>"`（v0.59.0）→ `echo` が届く前にシェルのプロンプトが出ている（ログの `out` の行が `in key` の行より前）、`hi` が表示され、1 秒後にペインが窓を取る。`filer --keys "<Wait:1.5s>"` はコマンド行で断られ、`<Wait:500>` と書き方を示す'''
"25.20" = "何もリダイレクトせずに `filer env` と `filer --version` → 25.1 のとおり、今までどおり画面に出る。コンソールの経路は変わっていない"

# 26. アプリ内からのバグ報告
"26.1" = '`<F12>` を押し、`<Enter>`（または `o`）→ `<F12>` はまず **Report a bug** のパネルを出し、版・OS の行・直前のキー・最新のエラー・描画・倍率・設定ファイルの名前を並べる（v0.73.58、Q62）。枠はボタンのすぐ下で終わり、下に空いた帯が無い（v0.73.64、Q66）。最初のボタンは `[o] / <Enter> Open the form in your browser` と書かれ、`<Enter>` がそれを選ぶ（v0.73.73、Q69）。`<Enter>` までは何も開かない。そのあと既定のブラウザで GitHub の新規 issue フォームが開き、トーストがそう言う'
"26.2" = 'フォームを見る → 見出しがどれも英語と日本語の 2 段（`What happened / 何が起きたか`、Q63）。**filer version**、**OS and architecture**、**Keys that reproduce it**（`Last keys, oldest first: …`）、**What filer knew**（パネルの行）が埋まっていて、残りは空。ユーザー名の入ったパスはどこにも出ない（Q64）。ホームの下のフルパスを含むエラーのあとでも同じ: 先にホームの下の無いフォルダを開き（`g<Space>` と作った名前）、フォームの `Last error` が `~\…` になる（v0.74.6）'
"26.3" = '埋まっている版を、ターミナルの `filer --version` と比べる → アーキテクチャも含めて同じ文字列'
"26.4" = '埋まっている OS の行を `winver` と比べる → エディション・機能更新・ビルドがすべて一致し、UBR も入っている（`Windows 11 Pro 25H2 (build 26200.9457)`）'
"26.4b" = 'フォーム自身が載せている PowerShell の断片と比べる → 同じ事実。上から貼り直す価値のあるものが残っていない'
"26.5" = 'ARM64 機で **ARM64** ビルドを使う → OS arch と Process arch がどちらも `aarch64`'
"26.6" = 'ARM64 機で **x64** ビルドを使う（エミュレーション）→ OS arch は `aarch64`、Process arch は `x86_64` —— **食い違うことが、まさに報告したい事実**'
"26.7" = '報告を投稿する → 投稿でき、あらかじめ埋まっていた欄も残る'
"26.8" = '既定のブラウザが未設定（または関連付けが壊れている）状態で `<F12>` → 失敗を述べるエラーのトースト。**ウィンドウは動き続ける**'
"26.9" = 'ターミナルペインの中から `<F12>`（先に `<C-t>`）→ 何も起きない。`[term]` がシェルに渡しているためで、これが正しい'
"26.10" = "26.8 と同じく関連付けを壊した状態で `<F12>`（v0.52.0）→ エラーのトーストが、報告のリンクが**クリップボードにある**とも言う。ブラウザに貼ると同じ、埋まった状態のフォームが開く。ブラウザが開けたときはクリップボードに触らない"
"26.11" = '`<F12>` のあと `c`。もう一度 `<F12>` のあと `<Esc>`（v0.73.58、Q62）→ `c` は同じリンクをクリップボードに置いてそう言い、`FILER_KEYS_DONE` に `report:` の行が出る。ブラウザは開かない。`<Esc>`（または `n`）はパネルを閉じ、何も開かず何も写さない'
"26.12" = '`<F12>` のあと、パネルに無いキー（`(`）、次に `n`（v0.73.78、Q71）→ `(` ではパネルが閉じない（後の `<State:>` で `overlay: confirm`）。何も開かず、何もコピーされない。`n` で閉じる。以前はほかのキーで黙って閉じ、次の `<Enter>` が一覧に届いた'

