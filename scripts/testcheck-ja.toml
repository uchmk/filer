# 44. ディスク使用量
"44.1" = '`node_modules` のあるプロジェクトで `gu` → 子が大きい順に棒付きで並ぶ。`node_modules` が上位に来て、合計が自身のエントリよりはるかに大きい'
"44.2" = '`gu` してから `<Esc>` → 元のディレクトリに戻り、カーソルも元の位置。走査は止まる（抜けたあと CPU を使わない）'
"44.3" = '30 万ファイル超のツリーで `gu` → 完了し、走査を打ち切ったことと合計が下限値であることを述べる'
"44.4" = '`.gitignore` された `target/` や `build/` を含むフォルダで `gu` → **数に入る**（除外されない）'
"44.5" = '容量の大半を隠しフォルダが占める場所で `gu` → 数に入り、表示もされる'
"44.6" = '大きなツリーへのシンボリックリンク / ジャンクションを含むフォルダで `gu` → リンクは 1 エントリ扱いでツリーの二重計上にならず、固まらない'
"44.7" = '`C:\` で `gu` → 答えが出る。上位のフォルダが WizTree やエクスプローラーの表示と見比べて妥当'
"44.8" = 'ネットワーク共有（UNC）で `gu` → 答えるか、穏当に失敗する。走査の途中でも `<Esc>` で抜けられる'
"44.9" = '`gu` のあと `j`/`k`、`y`、`d`、スペースで選択 → 通常の一覧キーが全部効く。**パネルではなく一覧そのもの**だから'
"44.10" = '`gu` のあとフォルダで `Enter`、続けて `h`、もう一度 `h`（v0.63.0。それ以前は `Enter` でビューを抜けた）→ `Enter`: ビューのまま、そのフォルダを測る（ヘッダのパスがそのフォルダ）。1 回目の `h`: 1 つ上に戻り、ビューのまま、出てきたフォルダにカーソル。2 回目の `h`（`gu` を押したフォルダ）: ビューが閉じて普通の一覧に戻る'
"44.11" = '使用量ビューを開いたまま `gu` → メッセージを添えて断られる（戻れないビューにならない）'
"44.12" = '`gu` のあと `,` で並べ替え直す → 指示どおり順序が変わる。`<Esc>` してからもう一度 `gu` すれば大きい順に戻る（ビューの中の `gu` は断られる。44.11）'
"44.13" = 'フォルダの合計をエクスプローラーのプロパティと比べる → 丸め誤差の範囲で一致。**ハードリンクは多めに出るが、それは仕様として文書化してある**'
"44.14" = "タブを `linemode mtime`（`m t`）にして `gu`、すぐ `<Esc>`（v0.56.0）→ 行には日付ではなくサイズ（`1.5 M`、`6.0 K`）が出る。`<Esc>` の後は日付に戻り、`Measuring…` のトーストもすぐ消える"
"44.17" = '`gu` のあと、ビューの中で `m t`、続けて `m u`（v0.58.0）→ `m t` で数字が日付に替わり棒だけが残る。`m u` で**歩き直さずに**サイズが戻る（`Measuring…` が出ない）。`<Esc>` でタブ自身の表示に戻るのは今までどおり'
"44.16" = '数秒かかる大きさの木で `gu` して、見出しを見る（v0.57.3）→ 歩いている間は `N measured so far` で増えていき、合計のトーストが出たら `N items` になる'
'44.19' = '''数秒かかる木で `gu` し、合計のトーストが消えるまで待つ（v0.59.2）→ ビューを開いている間ずっと、見出しが `N items · <大きさ> total` と言う（ここが使用量ビューだと分かる唯一の印）。その木で `filer --keys "gu<Wait:0>j"` とすると、カーソルは歩きが終わってから動く'''
'44.20' = 'macOS / Linux: `one/` に 400 KB のファイルを置き、`two/a` としてハードリンクし（`ln one/a two/a`）、親で `gu`（v0.75.21）→ 合計は 400 KB が 1 回（`391 K`）で、2 回ではない。`du` と同じく 2 つ目の名前は数えない。Windows の NTFS のハードリンクは今も名前ごとに数える（README）'

# 45. 2 つのフォルダを比べる
"45.3" = '`n` / `N` → `=` でない行の間を歩き、一致した行は飛ばす。末尾ではその旨を述べる'
"45.4" = '`gg` / `G` → 最初の行と最後の行'
"45.6" = '最後の 1 バイトだけが違うファイルを含むツリー → その行が `=` ではなく `~` になる'
"45.8" = '片方ではフォルダ、もう片方では同名のファイル → `~`'
"45.9" = 'ファイル 1 つとフォルダ 1 つを選んで `<A-d>` → `compare two files, or two folders — not one of each` と断られる'
"45.10" = '`node_modules` 同士（10 万パス超）→ 答えが出るか、打ち切ったと述べる。ウィンドウは固まらない'
"45.11" = 'シンボリックリンクの指す先だけが違う 2 つのツリー → そのリンクの行が「異なる」と読める'
"45.12" = '2 分割して各ペインでフォルダの上に立ち、`<A-d>` → その 2 つが比較される'
"45.13" = '`q` / `<Esc>` → 閉じる。そして 2 つの**ファイル**はこれまでどおり行単位で比較できる'
"45.14" = "数百のパスのうち奥の 1 ファイルだけが違う 2 つのツリーを比べる（v0.53.0）→ カーソルが**そのファイルの上**で開く（先頭の行ではない）。差分の無い組は先頭で開く"
"45.15" = "`z`、続けて `j` / `n`、もう一度 `z` → `=` の行が一覧から消える。フッタは数え続け、`matches hidden (z)` が付く。`j` と `n` は見えている行だけを歩く。2 回目の `z` で全部の行が戻り、カーソルは同じパスの上にある"
"45.16" = '中の `t1` を指す**ジャンクション**（`mklink /J ln t1`）を持つフォルダを写し、元と写しを比べる（v0.55.0）→ `= ln`。行き先の文字列は違っても、どちらも自分のツリーの `t1` に着くので同じと読む'
'45.17' = '''別の場所にある同じ名前の 2 つのフォルダ（片方にサブフォルダあり）を比べる（v0.59.4）→ 見出しの下に両方の**フルパス**（`…\left\proj  ↔  …\right\proj`）。長ければそれぞれ真ん中が切られ、両端は読める。フォルダの行は子のパスと同じく `\` で終わり、`/` ではない'''
'45.18' = '''2 つのフォルダを比べ、`~` のファイルの行にカーソルを置いて `<Enter>`、続けて `q`（v0.61.0）→ 2 つのファイルが行単位で横に並び、題に両方のフルパスが出る。`q` でフォルダの比較の**同じ行**に戻る（閉じない、先頭に戻らない）。片側にしか無い行で `<Enter>` を押すと `Compare: it is on one side only` と出て動かない'''

# 46. spot パネルの Git セクション
"46.1" = 'コミット済みのファイルで `<Tab>` → **Git** セクションが出る。`Last change` が短いハッシュと `YYYY-MM-DD HH:MM`、続いて `Subject` と `Author`'
"46.2" = '`git log -1 -- <そのファイル>` と突き合わせる → 同じコミット。リポジトリの最新ではなく、**そのパスに触れた最新のもの**'
