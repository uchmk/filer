# 32. オープナー
"32.1" = 'README の `[opener]` / `[open]` の例を `yazi.toml` に貼って再起動し、`.txt` で `<S-Enter>` → Neovim / VS Code / サクラエディタ / Open with the default app がこの順に、コマンド行ではなく**説明文**で並ぶ（v0.71.11 からの例の並び）'
"32.2" = '同じファイルで `<Enter>` → 先頭の Neovim で開く。`block = true` なので専用のコンソールで（既定の端末が Windows Terminal なら新しいタブ）、`nvim` のプロセスのコマンド行がファイルの引用符付きパスで終わる'
"32.3" = '`.pdf` で `<S-Enter>` → Edge と Chrome が先に、そのあと既定アプリの項目'
