'40.14' = '''`FILER_PTY_LOG` を設定して nvim の中でホイール（v0.55.0）。カーソルを窓の中ほどに置き、ペインを最大化する（`<C-S-Enter>`）か `:set scrolloff=0` にする。3 分の 1 の高さのペインでは nvim 自身の `scrolloff`（11 行のうち 4）が、filer が何を送ってもカーソルを引きずる（#107）→ nvim の表示がスクロールし、**カーソルは同じ行のまま**（前後で `:echo line('.')`）。ログには `\e[A` ではなく `\e[<64;…M` / `\e[<65;…M` が出る'''
"40.15" = "ペインで lazygit を動かし（v0.55.0）、`<S-End>` を毎秒 30 回で約 300 回、その途中に `?` と `<Esc>` を入れる（#99 が #93 を組み直した形）→ `<Esc>` から 1 秒以内にキー一覧が閉じる。v0.55.0 までは数分開いたままだった。レコードで送った `<Esc>` の直後に `\\e[1;2F` の `<S-End>` が来ると、tcell には 1 つの列に読めていた"
"40.16" = "`FILER_PTY_LOG` を設定して（v0.55.0）ペインを開き、`ping -t localhost` と打って `<C-c>`、続けて打った語の上で `<C-Left>` と `<Tab>` の補完 → ログの `out` の最初のほうに `\\e[?9001h` があり、`in key` の行は `\\e[1;5D` ではなくレコード（`\\e[…;…;…;1;…;1_`）。`<C-c>` で ping が止まり、`<C-Left>` は 1 語戻り、`<Tab>` は補完する。シェルはレコードを本物のキーボードと同じに読む"
"40.17" = '`FILER_PTY_LOG` を設定して、nvim の中でホイールを 1 ノッチ、次に 3 ノッチ（v0.58.1）→ ノッチ 1 つにつき `\\e[<64;…M`（または `65`）が 1 本: 1 本、次に 3 本。v0.58.1 までは平滑化した量を数えていたので、3 ノッチで 5 本出ていた'

