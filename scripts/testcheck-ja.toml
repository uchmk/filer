# 36. T と <F3> の違い
'36.10' = '''`[[mgr.prepend_keymap]]` で `<S-t>` を目に見えるもの（`run = "quit"`）に割り当てて `<C-F5>`、続けて `T`（Shift と t）を押す → **割り当ては発火しない**: filer は終わらず、`T` は既定の `T` の動き（36.1）をする。Shift と文字はその文字そのものとして届くので、`<S-t>` はどのキーにも当たらない。テストが固定している教訓そのもの。記法としては正しいので、警告も出ない（`filer env` の `Warnings` は `none`）。（既定を置き換える `[[mgr.keymap]]` に書くと、一覧ではどのキーも、`q` も含めて何も起きない）'''
"36.13" = '最大化プレビュー（`T`）の状態で `q` → 列が戻り、アプリは動き続ける'
"36.15" = '何も開いていない状態で `q` → 1 回目で終了する'
'36.18' = '''`[[mgr.prepend_keymap]]` で `on = "Q"` / `run = "quit"` を割り当て、`<F3>` を開いた状態で `Q`（`[[mgr.keymap]]` だと既定が置き換わり、`<F3>` も消える）→ `q` と同じくまずパネルが閉じる。**挙動は文字ではなく動作に紐づいている**'''

"36.14" = '`help`（`~`）、タスク一覧、spot（`Tab`）、比較（`<A-d>`）のそれぞれで `q` → 閉じるだけでアプリは動き続ける（以前から同じ。これらは元々自分のレイヤーを持っている）'

