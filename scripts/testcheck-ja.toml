# The Japanese half of TESTING-CHECKS.md.
#
# `examples/make-testcheck.rs` reads this and TESTING.md, and writes
# TESTING-CHECKS.md from the two. TESTING.md owns the check ids, the section
# list and the English text; this file owns nothing but the Japanese, so a row
# that leaves TESTING.md leaves the checklist whatever is written here, and a
# row that arrives shows up untranslated rather than not at all.
#
# `[section."N"]` takes `title` (Japanese heading), `setup` (a block to paste
# before working the section) and `note` (a sentence of context). `[row]` maps
# a check id to its Japanese. Every one of them is optional: what is missing
# falls back to TESTING.md's own English, marked 〔未訳〕.
#
# The English is printed beside the Japanese on every row, so the two can be
# compared without opening TESTING.md. That is deliberate -- a translation kept
# in a separate file drifts from its source, and the only defence that costs
# nothing is putting them on the same line.

# テストが id を名乗っていても、人の一覧に残すもの。
# 13.10〜13.12 は `spot_link_section` が覆っているが、あのモジュールは `#[cfg(unix)]`
# ——Windows でシンボリックリンクを作るのが 13.8 の権限問題だから。つまり**このチェック
# リストを使う当の Windows では 1 行も走っていない。**
#
# ここは表より前に置くこと。TOML では、最初の `[table]` より後ろに書いた素のキーは
# その表の中身になる。
manual = ["13.10", "13.11", "13.12"]

