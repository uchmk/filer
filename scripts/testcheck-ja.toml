"31.11" = '**もう一方のペイン**（`<C-w>`）と 2 つ目のタブでホストを開く → どちらも問題なし'
"31.13" = '応答はするが何も共有していないホスト（v0.57.3）→ 一覧は `(empty)` ではなく `(no shares)` と言う'
'31.14' = '''`g<Space>` で自分のサブネットの何も応答しないアドレスを打って `<Enter>`、諦める前に `<Esc>`（v0.58.1）。最近試していないアドレスを使う: Windows は失敗を覚えていて、同じアドレスへの 2 回目は約 1 秒で os error 1203 になり、取りやめる待ちが無い（#233）→ すぐ元の場所に戻り、`Stopped waiting for \\<アドレス>` のトーストが出て、`j` / `k` が効く。取りやめた試みが後で時間切れになっても何も言わない'''
