"33.16" = 'filer を**起動したまま** `%APPDATA%\filer\filer.toml` を作り、`~` を押す → そのファイルが 1 行として、警告色で `on disk, not read yet — <C-F5> re-reads config` と出る。ディレクトリは `nothing here` に**ならない**（v0.34.0）'
