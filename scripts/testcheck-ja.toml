"33.13" = '`[[preview]]` の無い、それ以外は正常な `yazi.toml` に `[term]` を入れる → `… belongs in filer.toml and was ignored`。*unread* ではなく *ignored* —— ファイルの残りは読み込まれている'
"33.14" = '`[opener]` を `filer.toml` に入れる → 逆向きの同じ警告（`belongs in yazi.toml`）'
