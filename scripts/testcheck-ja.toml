"32.5" = '名前に**空白**を含むファイルで、上のそれぞれを試す → 1 つの引数として渡り、正しく開く'
"32.6" = '複数選択してから `<Enter>` → 全部がひとつの起動に渡される'
"32.7" = '`*.{xlsx,xls,csv}` と書いたルール → 3 つとも一致する（v0.17.0 以前はこれが効かなかった）'
"32.8" = '入っていないプログラムを指定したオープナー → 数秒以内にエラーのトースト。固まらない'
"32.8a" = 'プログラムを空白と丸括弧を含む**引用符付きのフルパス**で指定したオープナー（`"C:\Program Files (x86)\sakura\sakura.exe" %*`）→ 開く。`Win32_Process` で `sakura.exe` がファイルの引用符付きパスを 1 つの引数として受け取っている。これが v0.17.0 のバグで、`cmd` が行を壊し、しかも失敗が無言だった'
"32.8b" = '同じオープナーを `<S-Enter>` から**と**、`edit` の先頭に移して `<Enter>` から、両方試す → どちらもファイルで `sakura.exe` が起動する。同じ起動処理へ別の経路で入るため'
"32.8c" = 'パスにわざと打ち間違いを入れたオープナー → 失敗を述べるトースト。日本語版 Windows では `cmd` の文言ではなく終了コードが出るはずで、**それは仕様であって報告すべきバグではない**'
"32.9" = 'Markdown のファイルで `l` でアウトラインに入り、`j` で下の見出しへ動いて `<S-Enter>`、サクラエディタを選ぶ（v0.47.29 でスイッチを `-L=` から `-Y=` に直した）→ `Win32_Process` に `sakura.exe -Y=<その見出しの行> "<ファイル>"` が出る。行はプレビューと同じく 1 から数える'
'32.9a' = '''同じことをして、サクラエディタのステータスバーを文字で読む（`msctls_statusbar32` に `SendMessage` `SB_GETTEXTW`）→ `<その見出しの行> 行 1 桁` と出て、カーソルの下の文字が見出しの最初の文字。対照として、サクラが一度も開いていない写しを `-Y=` 無しで開くと `1 行 1 桁`（同じファイルでは成り立たない。サクラは前に閉じた行で開き直す。`m_bRestoreCurPosition=1`、#198）。サクラは `-L=` を無視するので、v0.47.29 より前は 1 行目か前回の位置で開いた（#196 でステータスバーが読めると分かった）'''
'32.10' = '''プログラム名を打ち間違えたオープナー（`run = 'Hidemruu.exe %s'`）を `<S-Enter>` で選ぶ（v0.59.1）→ エラーが `exit code 1` ではなく ``Open failed: `Hidemruu.exe` was not found — …`` と言う。プログラムはあるが失敗したときは今までどおり終了コードを言う'''
'32.11' = '''Linux: `block = true` のオープナー（`run = 'nvim %*'`。`vim` でもよい）で、フォルダ名とファイル名に空白と `'` を含むファイルを `<Enter>`（v0.72.0）→ 端末の窓が開いてエディタが動く。`ps` でエディタがパス全体を 1 つの引数で受け取ったこと、`/proc/<pid>/cwd` が一覧のフォルダであることが読める'''
'32.12' = 'Linux: 同じことを `TERMINAL="xterm -title picked"` で → 窓のタイトルが `picked`（`xdotool getwindowname`）。`filer env` の `block = true openers` の行が `xterm -title picked` を名指す。`TERMINAL` が無ければ、組み込みの一覧で最初に入っているものを名指す'
'32.13' = 'Linux: 入っていないプログラムを指定した `block = true` のオープナー → 端末が一瞬で閉じず、`[exit 127] Press Enter to close.` で止まる。そこで `<Enter>` を押すと閉じる'
'32.15' = '''Windows で **release の `filer.exe`**（自分のコンソールを持たない。`cargo run` は持つので出なかった）: `:` で `nvim`（v0.75.14、Q12）→ 新しいコンソールに nvim が描かれる（`~` の列とステータス行）。黒い窓でカーソルが点滅するだけにならない。`block = true` のオープナーで `<Enter>` しても同じ。新しいコンソールを `ReadConsoleOutputCharacter` で読むか、nvim の `:redir` で確かめる。以前は `Win32_Process` に `nvim` がいるのに何も描かれていなかった'''
'32.16' = '''Windows で release の `filer.exe`: `:` で `git log -5 --oneline`（v0.75.14、Q13）→ コンソールが 5 行と `続行するには何かキーを押してください . . .` のまま開いていて、キーで閉じる。`:` で `dir & pause` は 1 回だけ聞く。`;` は変わらない（コンソールも pause も無い）'''
'32.14' = 'macOS: `block = true` のオープナーでファイルを `<Enter>` → Terminal.app が前に出て、新しい窓で一覧のフォルダからエディタが動く。初回は macOS が filer に Terminal の操作を許すかを聞く。拒むと理由がトーストに出る'

