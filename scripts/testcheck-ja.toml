"1.30" = "最大化してから `<C-S-t>`（シェルを終わらせる） → ペインが消え、一覧が全高で描かれる（隙間の下に押し込まれない）。ペインの無い最大化が残らないこと"
"1.31" = "ペインで `lazygit` → `?` でキー一覧を開く → `Esc`（v0.48.6） → **一覧が閉じる。**v0.48.6 までは何度押しても閉じなかった（gh-dash など tcell のプログラムすべて同じ）。Windows Terminal が対照で、あちらでは最初から閉じる"
"1.32" = "ペインの pwsh のプロンプトで `abc` と打ち（Enter は押さない）、`Esc` → 行が空になる。PSReadLine は元々影響を受けていなかった。1.31 を直した変更がこちらを壊していないことを見る行"
"1.33" = "同梱の ConPTY を filer.exe の横に置いた状態で、ペインで `pwsh -File scripts\\keyprobe.ps1 -Query`（v0.49.0） → DA1 の応答が `\\e[?6c`（filer 自身の答えがそのまま通ったもの）で、文字の間に `{up:…}` が出ない。`\\e[?61;6;7;22;23;24;28;32;42c` なら Windows 標準の ConPTY が答えている —— 2 つのファイルが無いか、filer.exe の横に無い"
"1.34" = "続けてペインで `lazygit` → いつもの画面で開き、**メニューが開いていない。**Windows 標準の ConPTY では、押していないキーでコピー画面が開いた状態で始まっていた"
"1.35" = "ペインで `lazygit`（または長く動くコマンド）を動かしたまま `<C-S-t>`（v0.52.0）→ **End the shell?** と聞かれ、動いているものの名前が出る。`n` でシェルもプログラムも残り、`y` で両方終わって **Ended the shell** とトーストが出る"
"1.36" = "何も動いていないプロンプトで `<C-S-t>` → **確認は出ない。**ペインはすぐ消え、トーストに **Ended the shell** と出る。`<C-t>` で隠しただけのようには見えなくなった"
"1.37" = "ペインを**閉じた**まま、ファイルを選んで `<A-t>`（v0.57.0）→ ペインが開き、シェルのプロンプトが出たところで引用されたパスが行に入る。「The terminal is not open」とは言わず、プロファイル読み込み中のシェルに打って消えることもない。キーはペインに移る。v0.75.17（Q39）から、パスは最初の出力ではなく、最初の出力のあとシェルが 300 ms 静かになるまで待つ（最長 5 秒）。`FILER_PTY_LOG` を付けると、パスの `in` の記録がバナーの後ではなく、プロファイルとプロンプトの最後の `out` の後に来る"
"1.38" = 'シェルを開いたまま `<C-t>` で一覧に戻り、`<C-S-t>`。続けてもう一度 `<C-S-t>`（v0.67.25、Q53）→ 1 回目は一覧からシェルを終える。ペインが消え、トーストは **Ended the shell**（何か動いていれば 1.35 と同じく先に **End the shell?** と聞く）。2 回目はペインが無いので **No terminal to close** と言う（以前は何も起きなかった）'
'1.18' = '''OSC 7 を報告するシェルで、一覧側のディレクトリを変える。PowerShell 7 は自分では報告しない（pwsh 7.6.6 は 1 つも出さなかった）ので、先にフックを読み込む（pwsh は `filer shell-hook \| Add-Content $PROFILE`、bash は `filer shell-hook bash >> ~/.bashrc`。29 節）。そのあと `<C-S-t>` と `<C-t>` → シェルに余計な `cd` が打ち込まれない'''

# 2. ミニマップ
'2.2' = '''形を見る → コメント見出しが長い帯で 40 行ごとに並び、インデントされた塊は右から始まる帯。`long.rs` では 40 行ごとの空行が見出しのすぐ上にあって同じ帯に入る（帯 1 本が約 2 行なので、空行 1 本では丸ごとの隙間にならない。v0.73.59 から）ので、空行だけの帯を探さなくてよい。それ以外の縞は無い（v0.73.59 より前は、ファイルに関係なく丸めから 17〜19 px ごとに 1 px の隙間が出た）。**元のファイルの形に見えること**'''
