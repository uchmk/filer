# 12. undo と redo
"12.1" = '`many\` の中のファイルで `d` → ごみ箱に入る'
"12.2" = '`u` → 元の場所に戻る。トーストがそう言う'
"12.3" = '（F2 の最中に）タスクパネル `w` を見る → `Restore` の行が現れて完了する'
"12.4" = '`U` → もう一度削除される'
"12.5" = '別々のフォルダにある同名のファイルを、時間を空けて 2 つ削除してから `u` → **直前に消したほう**が戻る（古いほうではない）'
'12.8' = '''ファイルを `r` で改名 → `u` で戻す → **別の**ファイルを改名 → `U` → **redo は消えている。**新しい改名が履歴を分岐させたため'''
'12.8a' = '''ファイルを `r` で改名 → `u` → `a` で新しいファイルを作る → `U`（v0.60.0）→ `Nothing to redo`。v0.60.0 からはファイルの作成も取り消しの手順になる（12.17）ので、12.8 の改名と同じく履歴を分岐させる。v0.60.0 より前は、新しいファイルは何も残さず redo が残った（#83、#225）'''
"12.9" = 'ファイルを `d` で消し、**同じ名前のファイルを先に作ってから** `u` → `u` が「その名前は使われている」と名前を挙げて断り、**取り消しの手順は残る。**邪魔なファイルをどけてもう一度押すと通る'
"12.12" = 'ロックされたファイルが無い状態で `d` → 以前のまま。そしてエクスプローラー自身の取り消し履歴に**項目が 1 つだけ**残る（まとめて渡す呼び出しが通常の経路であることの確認）'
"12.10" = '別のプログラムで開いてロックされたファイルを、**他の数件と一緒に**選んで `d` → 他は消える。メッセージが**消えなかったファイルの名前を挙げ**、タスクパネルの件数も実際に消えた数と合う（v0.27.1 まで `Trash: trash: Error … Some operations were aborted` と名前を挙げずに言い、全件成功として数えていた）'
"12.13" = '1 つのファイルで `d`、続けて 2 つで `d`（v0.57.3）→ そのたびにトーストが出る: `Trashed <名前> — u to undo`、次に `Trashed 2 item(s) — u to undo`。v0.57.3 まで `d` は何も言わず、`D` と見分けがつかなかった'
'12.14' = '''5 つのファイルで `d` し、走っている間に `w`（v0.58.1）。時間がかかるように大きなファイルにする: 同じドライブのごみ箱は名前の付け替えで受け取るので、40 MB や 120 MB の 5 つは 1 コマで消える。約 400 MB の 5 つで行が見えた（#136）→ 行は `Trash 5 item(s)  [running]`（動詞は **1 回**）、その下の行は `0/5 files` で、`0 B / 0 B` は出ない'''
'12.15' = '''12.10 と同じく、5 件のうち 1 件を別のプログラムで開いたまま 5 件を `d`、続けて `u`（v0.59.7）→ エラーが開いているファイルを `it is open in another program` と名指しし、`u` で入った **4 件**が戻る。v0.59.7 までは `Some operations were aborted` とだけ言い、`u` は `Nothing to undo` だった'''
'12.16' = '''12.9 をもう一度: ファイルを `d`、同じ名前のファイルを新しく作り、`u`（v0.59.7）→ エラーが `RestoreCollision { … TrashItem { id: "C:\$Recycle.Bin…` ではなく `a file by that name is already there. Move it away and press u again` と言う。新しいファイルをどけてからの `u` は通る'''
'12.17' = '''`a` で `new/deep/note.txt` を作り、`u`、続けて `U`（v0.60.0）→ `u` で `note.txt` と、そのために作った 2 つのフォルダが消え、トーストは `Removed note.txt and 2 folder(s)`（v0.67.10。それまでは `Removed note.txt` で、フォルダのことを言わなかった）。`U` で 3 つとも戻る。ファイルに何か書いてから `u` すると残り、書き込まれたというエラーが出る'''
'12.18' = '''ファイルをヤンクし、別のフォルダで `-`、続けて `u`、`U`（v0.60.0）→ `-` が `Linked <名前> — u to undo` と言う（v0.67.10。それまではヤンクのトーストが残るだけだった）。`u` はリンクだけを消し、元のファイルと中身はそのまま。`U` でリンクが戻る。Windows では `=`（ハードリンク）とフォルダへの `-` でも'''
"12.11" = 'ごみ箱を無効にしたドライブで `d` → 同じ形のメッセージが、ファイル名を挙げて出る'
'12.11a' = '''RAM ディスク（`R:\Temp`、ImDisk）の上のファイルで `d`（v0.73.28）→ ファイルは残り、`<名前>: the Recycle Bin can't take files from R: (this drive can't report its own paths: a RAM disk or a virtual drive). Use D to delete permanently` と出る。以前は `CanonicalizePath { original: "R:\Temp\…" }` だった。そのあと `D` なら消せ、赤い行は `Deleted <名前>` に置き換わる（v0.73.35、#207）'''

