"30.10" = 'ターミナルでドラッグして選択し、そのあと右クリック → 離した時点でコピーされていて、右クリックで貼り戻される（選択でコピー、右クリックで貼り付け）'
'30.11' = '''**3 行**をコピーして、bracketed paste を要求するシェル（`FILER_PTY_LOG` の `out` に `\e[?2004h` が出る）のプロンプトでターミナルに右クリック。Git Bash などの bash。Windows PowerShell 5.1（PSReadLine 2.0.0）も pwsh 7.6（PSReadLine 2.4.5）も要求しないので、この行のシェルではない（filer が印を付けないのは正しい）→ 3 行ともバッファに入り、`<Enter>` を押すまで**何も実行されない**'''
"30.12" = 'bracketed paste を**要求しない**シェル（`cmd.exe`）で同じこと → これまでどおり行が実行される。そして `[200~` のような余計な文字が出ない'
"30.13" = '`vim` を開いた状態のターミナルで右クリック → 文字が挿入される。画面に `[200~` が出ない'
"30.14" = 'ターミナルで `<C-v>` → 右クリックと同じ（30.11 の挙動も含めて）'
"30.15" = '`report.txt` で `r`、2 つのファイルで `R`、`gSpace`（`cd`）、`a.txt` で `E`（v0.55.0）→ どれも入っている文字が選択された状態で開き、打つと置き換わる。`r` は `report`、`R` は `{name}{ext}` 全体、`cd` はパス全体、`E` は `.zip` の前の `a` を選ぶ。続けてクリップボードにパスを入れ、`cd` の選択範囲の**上**を右クリック → パスが選択範囲を置き換え、`<Enter>` でそこへ行く'

