"39.3" = '`<A-k>` を押し続けて最上部まで行き、`<A-j>` で戻る → 行き過ぎずに両端で止まる。戻るときの空押しが無い'
"39.4" = '`<S-PageUp>` / `<S-PageDown>` / `<S-Home>` / `<S-End>` とホイール → 以前のまま'
"39.5" = 'ターミナルから**フォーカスを外して**（`<C-t>` で一覧へ戻って）`<A-j>` → ターミナルではなく**プレビュー**がスクロールする。キーではなくレイヤーが決めている'
"39.6" = 'ペインの中で Alt+j を読むプログラムを動かす（`nnoremap <A-j> :m+1<CR>` を設定した `nvim`）→ v0.38.0 以降は**キーが届く**（40 節を参照）。それ以前は届かなかった'
"39.7" = '`[[term.prepend_keymap]]` で `<A-j>` を `noop` に割り当てて `<C-F5>` → キーは何もせず、**シェルにも届かない。**ここで割り当てたものは消費される。返すには `[term] keymap = [...]` を丸ごと置き換える必要がある'
"39.8" = 'シェルのプロンプトで Alt+b / Alt+f / Alt+d → これまでどおり readline に届く。取られたのは j と k だけ'
