"41.1" = 'fixtures の `.zip` で `<Tab>` → **Archive** セクション（形式、エントリ数とフォルダ数、展開後サイズ、圧縮率、`Encrypted: no`）'
"41.2" = '**7-Zip で暗号化した** zip で `<Tab>` → `Encrypted: yes (entries need a password)` と出て、件数も出ている。**単体テストにできない**（この `zip` のビルドに AES 書き込みが無く、暗号化した fixture をツリー内で作れない）'
"41.3" = '「ファイル名も暗号化」で作った 7z で `<Tab>` → `Encrypted: yes (the listing itself)` と出て、**件数は一切出ない**（その先が分からないため）'
"41.4" = 'エントリが 2 万を超える書庫で `<Tab>` → ウィンドウが止まらずにパネルが出て、`Scanned: first 20,000 entries` と述べる'
"41.5" = 'メモ帳で CRLF 保存したファイルと LF のファイルで `<Tab>` → `Line endings` の行が件数付きで区別する'
"41.6" = 'メモ帳の「UTF-16 LE」保存で `<Tab>` → `Encoding: UTF-16 LE`、`BOM: UTF-16 LE (FF FE)`。バイナリ扱いに**ならない**'
"41.7" = '2GB のログで `<Tab>` → 行がすぐ出て `Scanned: first 1.0 M of …` となり、**`Final newline` の行は出ない**（末尾を読んでいないため）'
"41.8" = 'リリースの 6 つのバイナリそれぞれで `<Tab>` → `Architecture` が成果物の名前のトリプルと一致する（`x86_64` / `aarch64`）'
"41.9" = '`C:\Windows\explorer.exe` と、`.dll` で `<Tab>` → `Windows GUI` / `DLL`'
