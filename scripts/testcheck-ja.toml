"1.21" = "ペインを開いたまま、名前に `'` を含むディレクトリへ一覧を移動する（v0.47.34） → `cd` が通ってプロンプトが戻る。1.20 と同じ引用が、filer 自身が打つパスにも効いていること"
"1.22" = "`[term] shell` を Git Bash のフルパスにして、ペインを開いたまま **普通の**ディレクトリ（`'` も空白も無い）へ一覧を移動する → `cd` が着いて、プロンプトがそのディレクトリになる。**`bash: cd: R:Tempfiler-fixtures: No such file or directory` にならないこと** —— 引用の外の `\\` は POSIX シェルではエスケープなので、v0.48.1 まで普通の Windows パスには一切入れなかった。1.20 と 1.21 はどちらも `'` のある名前を指定しているので、これを見落としていた"
