# Advisories `cargo audit` is told to pass over, each with the reason it does
# not reach this program. Nothing goes in here because it is inconvenient: an
# ignore list that is not argued for turns the check into a formality, and the
# next real finding lands in a list nobody reads.

[advisories]
ignore = [
    # RUSTSEC-2026-0245 -- path traversal in sevenz-rust's `decompress_impl`,
    # 8.3 high, no fixed version. It is the library's own extraction that is
    # vulnerable: it joins an entry's name onto the destination, so an entry
    # named `../../x` is written outside it.
    #
    # filer never runs that code. `extract_7z` calls
    # `decompress_with_extract_fn` and supplies the writer, and the destination
    # the library worked out is taken as an argument and discarded -- the path
    # actually written comes from `safe_dest`, which rebuilds it component by
    # component and returns `None` on `ParentDir`, `RootDir` or `Prefix`. An
    # allowlist of `Normal` components cannot be walked out of, and a refused
    # entry is counted and reported rather than skipped in silence.
    #
    # The same guard is on the zip and tar paths, for the same reason and since
    # before this advisory: an archive is a list of filenames from a stranger.
    #
    # This is a note, not a fix. sevenz-rust is also unmaintained
    # (RUSTSEC-2026-0246) and its repository is gone, so the advisory's own
    # advice is to move to `sevenz-rust2`. That is in TODO.md. Delete this entry
    # when it happens -- and the check will say so if it is deleted too early.
    "RUSTSEC-2026-0245",
]
