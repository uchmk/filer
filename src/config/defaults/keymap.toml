# Built-in keymap. Mirrors yazi's defaults so an existing yazi keymap.toml can
# prepend/append/replace on top of it. Users never edit this file; put your
# changes in yazi's keymap.toml (or filer's own keymap.toml).

[[mgr.keymap]]
on = "<Esc>"
run = "escape"
desc = "Exit visual mode, clear selection, or cancel search"
[[mgr.keymap]]
on = "q"
run = "quit"
desc = "Quit the process"
[[mgr.keymap]]
on = "<C-q>"
run = "quit"
desc = "Quit the process"
[[mgr.keymap]]
on = "<C-c>"
run = "close"
desc = "Close the current tab, or quit if it is the last"

# --- Navigation ---------------------------------------------------------------

[[mgr.keymap]]
on = "k"
run = "arrow -1"
desc = "Move cursor up"
[[mgr.keymap]]
on = "j"
run = "arrow 1"
desc = "Move cursor down"
[[mgr.keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Move cursor up"
[[mgr.keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Move cursor down"
[[mgr.keymap]]
on = "<C-u>"
run = "arrow -50%"
desc = "Move cursor up half page"
[[mgr.keymap]]
on = "<C-d>"
run = "arrow 50%"
desc = "Move cursor down half page"
[[mgr.keymap]]
on = "<C-b>"
run = "arrow -100%"
desc = "Move cursor up one page"
[[mgr.keymap]]
on = "<C-f>"
run = "arrow 100%"
desc = "Move cursor down one page"
[[mgr.keymap]]
on = "<PageUp>"
run = "arrow -100%"
desc = "Move cursor up one page"
[[mgr.keymap]]
on = "<PageDown>"
run = "arrow 100%"
desc = "Move cursor down one page"
[[mgr.keymap]]
on = [ "g", "g" ]
run = "arrow top"
desc = "Move cursor to the top"
[[mgr.keymap]]
on = "G"
run = "arrow bot"
desc = "Move cursor to the bottom"
[[mgr.keymap]]
on = "<Home>"
run = "arrow top"
desc = "Move cursor to the top"
[[mgr.keymap]]
on = "<End>"
run = "arrow bot"
desc = "Move cursor to the bottom"

[[mgr.keymap]]
on = "h"
run = "leave"
desc = "Go back to the parent directory"
[[mgr.keymap]]
on = "l"
run = "enter"
desc = "Enter the directory, or focus the file's outline"
[[mgr.keymap]]
on = "<Left>"
run = "leave"
desc = "Go back to the parent directory"
[[mgr.keymap]]
on = "<Right>"
run = "enter"
desc = "Enter the directory, or focus the file's outline"
[[mgr.keymap]]
on = "<Backspace>"
run = "leave"
desc = "Go back to the parent directory"
[[mgr.keymap]]
on = "H"
run = "back"
desc = "Go back to the previous directory"
[[mgr.keymap]]
on = "L"
run = "forward"
desc = "Go forward to the next directory"
[[mgr.keymap]]
on = "<F5>"
run = "refresh"
desc = "Re-read the current directory"

[[mgr.keymap]]
on = "<A-k>"
run = "seek -5"
desc = "Scroll the preview up"
[[mgr.keymap]]
on = "<A-j>"
run = "seek 5"
desc = "Scroll the preview down"
[[mgr.keymap]]
on = "M"
run = "toggle_render"
desc = "Switch Markdown preview between rendered and source"
[[mgr.keymap]]
on = "<BackTab>"
run = "toggle_outline"
desc = "Focus the preview's outline (functions / headings)"
[[mgr.keymap]]
on = "<Tab>"
run = "spot"
desc = "Spot hovered file"

# --- Selection ----------------------------------------------------------------

[[mgr.keymap]]
on = "<Space>"
run = [ "toggle", "arrow 1" ]
desc = "Toggle the current selection state"
[[mgr.keymap]]
on = "<C-a>"
run = "toggle_all --state=on"
desc = "Select all files"
[[mgr.keymap]]
on = "<C-r>"
run = "toggle_all"
desc = "Invert selection of all files"
[[mgr.keymap]]
on = "v"
run = "visual_mode"
desc = "Enter visual mode (selection mode)"
[[mgr.keymap]]
on = "V"
run = "visual_mode --unset"
desc = "Enter visual mode (unset mode)"

# --- Operations ---------------------------------------------------------------

[[mgr.keymap]]
on = "o"
run = "open"
desc = "Open the selected files"
[[mgr.keymap]]
on = "O"
run = "open --interactive"
desc = "Open the selected files interactively"
[[mgr.keymap]]
on = "<Enter>"
run = "open"
desc = "Open the selected files"
[[mgr.keymap]]
on = "<S-Enter>"
run = "open --interactive"
desc = "Open the selected files interactively"

[[mgr.keymap]]
on = "y"
run = "yank"
desc = "Yank the selected files (copy)"
[[mgr.keymap]]
on = "x"
run = "yank --cut"
desc = "Yank the selected files (cut)"
[[mgr.keymap]]
on = "Y"
run = "unyank"
desc = "Cancel the yank status"
[[mgr.keymap]]
on = "X"
run = "unyank"
desc = "Cancel the yank status"
[[mgr.keymap]]
on = "p"
run = "paste"
desc = "Paste the files"
[[mgr.keymap]]
on = "P"
run = "paste --force"
desc = "Paste the files (overwrite if the destination exists)"
[[mgr.keymap]]
on = "-"
run = "link"
desc = "Symlink the absolute path of yanked files"
[[mgr.keymap]]
on = "_"
run = "link --relative"
desc = "Symlink the relative path of yanked files"
[[mgr.keymap]]
on = "<C-->"
run = "hardlink"
desc = "Hardlink the yanked files"

[[mgr.keymap]]
on = "d"
run = "remove"
desc = "Move the files to the recycle bin"
[[mgr.keymap]]
on = "D"
run = "remove --permanently"
desc = "Permanently delete the files"
[[mgr.keymap]]
on = "a"
run = "create"
desc = "Create a file (end with / for a directory)"
[[mgr.keymap]]
on = "r"
run = "rename"
desc = "Rename the file or directory"
[[mgr.keymap]]
on = ";"
run = "shell --interactive"
desc = "Run a shell command"
[[mgr.keymap]]
on = ":"
run = "shell --interactive --block"
desc = "Run a shell command (block until finished)"
[[mgr.keymap]]
on = "."
run = "hidden"
desc = "Toggle the visibility of hidden files"

[[mgr.keymap]]
on = [ "c", "c" ]
run = "copy path"
desc = "Copy the absolute path"
[[mgr.keymap]]
on = [ "c", "d" ]
run = "copy dirname"
desc = "Copy the path of the parent directory"
[[mgr.keymap]]
on = [ "c", "f" ]
run = "copy filename"
desc = "Copy the name of the file"
[[mgr.keymap]]
on = [ "c", "n" ]
run = "copy name_without_ext"
desc = "Copy the name of the file without extension"

# --- Find / filter / search ---------------------------------------------------

[[mgr.keymap]]
on = "/"
run = "find --smart"
desc = "Find next file"
[[mgr.keymap]]
on = "?"
run = "find --previous --smart"
desc = "Find previous file"
[[mgr.keymap]]
on = "n"
run = "find_arrow"
desc = "Go to the next found file"
[[mgr.keymap]]
on = "N"
run = "find_arrow --previous"
desc = "Go to the previous found file"
[[mgr.keymap]]
on = "f"
run = "filter --smart"
desc = "Filter the files"
[[mgr.keymap]]
on = "s"
run = "search --via=name"
desc = "Search files by name, recursively"
[[mgr.keymap]]
on = "S"
run = "search --via=content"
desc = "Search files by content, recursively"
[[mgr.keymap]]
on = "<C-s>"
run = "escape --search"
desc = "Cancel the ongoing search"
[[mgr.keymap]]
on = "z"
run = "jump"
desc = "Jump to a bookmark or a recently visited directory"

# --- Sorting ------------------------------------------------------------------

[[mgr.keymap]]
on = [ ",", "m" ]
run = "sort mtime --reverse"
desc = "Sort by modified time (newest first)"
[[mgr.keymap]]
on = [ ",", "M" ]
run = "sort mtime --no-reverse"
desc = "Sort by modified time (oldest first)"
[[mgr.keymap]]
on = [ ",", "b" ]
run = "sort btime --reverse"
desc = "Sort by created time (newest first)"
[[mgr.keymap]]
on = [ ",", "B" ]
run = "sort btime --no-reverse"
desc = "Sort by created time (oldest first)"
[[mgr.keymap]]
on = [ ",", "e" ]
run = "sort extension --no-reverse"
desc = "Sort by extension"
[[mgr.keymap]]
on = [ ",", "E" ]
run = "sort extension --reverse"
desc = "Sort by extension (reverse)"
[[mgr.keymap]]
on = [ ",", "a" ]
run = "sort alphabetical --no-reverse"
desc = "Sort alphabetically"
[[mgr.keymap]]
on = [ ",", "A" ]
run = "sort alphabetical --reverse"
desc = "Sort alphabetically (reverse)"
[[mgr.keymap]]
on = [ ",", "n" ]
run = "sort natural --no-reverse"
desc = "Sort naturally"
[[mgr.keymap]]
on = [ ",", "N" ]
run = "sort natural --reverse"
desc = "Sort naturally (reverse)"
[[mgr.keymap]]
on = [ ",", "s" ]
run = "sort size --reverse"
desc = "Sort by size (largest first)"
[[mgr.keymap]]
on = [ ",", "S" ]
run = "sort size --no-reverse"
desc = "Sort by size (smallest first)"
[[mgr.keymap]]
on = [ ",", "r" ]
run = "sort random --no-reverse"
desc = "Sort randomly"

# --- Line mode ----------------------------------------------------------------

[[mgr.keymap]]
on = [ "m", "s" ]
run = "linemode size"
desc = "Line mode: size"
[[mgr.keymap]]
on = [ "m", "t" ]
run = "linemode mtime"
desc = "Line mode: modified time"
[[mgr.keymap]]
on = [ "m", "b" ]
run = "linemode btime"
desc = "Line mode: created time"
[[mgr.keymap]]
on = [ "m", "p" ]
run = "linemode permissions"
desc = "Line mode: permissions"
[[mgr.keymap]]
on = [ "m", "n" ]
run = "linemode none"
desc = "Line mode: none"

# --- Goto ---------------------------------------------------------------------

[[mgr.keymap]]
on = [ "g", "h" ]
run = "cd ~"
desc = "Go to the home directory"
[[mgr.keymap]]
on = [ "g", "d" ]
run = "cd ~/Downloads"
desc = "Go to the downloads directory"
[[mgr.keymap]]
on = [ "g", "D" ]
run = "cd ~/Documents"
desc = "Go to the documents directory"
[[mgr.keymap]]
on = [ "g", "c" ]
run = "cd %APPDATA%/yazi/config"
desc = "Go to the config directory"
[[mgr.keymap]]
on = [ "g", "t" ]
run = "cd %TEMP%"
desc = "Go to the temporary directory"
[[mgr.keymap]]
on = [ "g", "<Space>" ]
run = "cd --interactive"
desc = "Jump interactively"
[[mgr.keymap]]
on = [ "g", "f" ]
run = "follow"
desc = "Follow the hovered symlink"

# --- Tabs ---------------------------------------------------------------------

[[mgr.keymap]]
on = "t"
run = "tab_create --current"
desc = "Create a new tab with the current directory"
[[mgr.keymap]]
on = "1"
run = "tab_switch 0"
desc = "Switch to the first tab"
[[mgr.keymap]]
on = "2"
run = "tab_switch 1"
desc = "Switch to the second tab"
[[mgr.keymap]]
on = "3"
run = "tab_switch 2"
desc = "Switch to the third tab"
[[mgr.keymap]]
on = "4"
run = "tab_switch 3"
desc = "Switch to the fourth tab"
[[mgr.keymap]]
on = "5"
run = "tab_switch 4"
desc = "Switch to the fifth tab"
[[mgr.keymap]]
on = "6"
run = "tab_switch 5"
desc = "Switch to the sixth tab"
[[mgr.keymap]]
on = "7"
run = "tab_switch 6"
desc = "Switch to the seventh tab"
[[mgr.keymap]]
on = "8"
run = "tab_switch 7"
desc = "Switch to the eighth tab"
[[mgr.keymap]]
on = "9"
run = "tab_switch 8"
desc = "Switch to the ninth tab"
[[mgr.keymap]]
on = "["
run = "tab_switch -1 --relative"
desc = "Switch to the previous tab"
[[mgr.keymap]]
on = "]"
run = "tab_switch 1 --relative"
desc = "Switch to the next tab"
[[mgr.keymap]]
on = "{"
run = "tab_swap -1"
desc = "Swap the current tab with the previous one"
[[mgr.keymap]]
on = "}"
run = "tab_swap 1"
desc = "Swap the current tab with the next one"

# --- Panels -------------------------------------------------------------------

[[mgr.keymap]]
on = "w"
run = "tasks_show"
desc = "Show the task manager"
[[mgr.keymap]]
on = "~"
run = "help"
desc = "Open help"
[[mgr.keymap]]
on = "<F1>"
run = "help"
desc = "Open help"

# --- Input line ---------------------------------------------------------------
# The input line is a native widget (so IME and clipboard behave), which means
# only these three actions are configurable.

[[input.keymap]]
on = "<Enter>"
run = "close --submit"
desc = "Submit"
[[input.keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel"
[[input.keymap]]
on = "<Tab>"
run = "complete"
desc = "Complete the path"

[[confirm.keymap]]
on = "<Enter>"
run = "close --submit"
desc = "Confirm"
[[confirm.keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel"

[[pick.keymap]]
on = "<Enter>"
run = "close --submit"
desc = "Submit"
[[pick.keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel"

[[help.keymap]]
on = "<Esc>"
run = "close"
desc = "Close help"

[[tasks.keymap]]
on = "<Esc>"
run = "close"
desc = "Close the task manager"

[[spot.keymap]]
on = "<Esc>"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "<Tab>"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "q"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "k"
run = "arrow -1"
desc = "Previous line"
[[spot.keymap]]
on = "j"
run = "arrow 1"
desc = "Next line"
[[spot.keymap]]
on = "h"
run = "swipe -1"
desc = "Swipe to the previous file"
[[spot.keymap]]
on = "l"
run = "swipe 1"
desc = "Swipe to the next file"
[[spot.keymap]]
on = "c"
run = "copy cell"
desc = "Copy the selected value"
[[spot.keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Previous line"
[[spot.keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Next line"
[[spot.keymap]]
on = "<Left>"
run = "swipe -1"
desc = "Swipe to the previous file"
[[spot.keymap]]
on = "<Right>"
run = "swipe 1"
desc = "Swipe to the next file"
[[spot.keymap]]
on = "y"
run = "copy cell"
desc = "Copy the selected value"
