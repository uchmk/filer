# --- Terminal pane ------------------------------------------------------------
# Only what is bound here is kept; every other key goes to the shell, which is
# what makes the pane a terminal rather than another set of bindings.

# `<C-t>` is the way in and the way back out, and it leaves the shell running:
# going to and fro is something you do all day, ending the shell a few times.
# The destructive one is the harder chord on purpose.
[[term.keymap]]
on = "<C-t>"
run = "close"
desc = "Give the keys back to the list (the shell keeps running)"
[[term.keymap]]
on = "<C-S-t>"
run = "terminal close"
desc = "Close the terminal and end the shell"
# Two keys the shell has no use for, so the app keeps them: without these the
# help and the palette are unreachable while the terminal holds the keys.
[[term.keymap]]
on = "<F1>"
run = "help"
desc = "Show the key list"
[[term.keymap]]
on = "<C-S-p>"
run = "palette"
desc = "Command palette"
# Trying a config change means pressing this often, and leaving the pane to do
# it also un-maximises the pane. Hardly any terminal program reads Ctrl+F5.
[[term.keymap]]
on = "<C-F5>"
run = "config_reload"
desc = "Read the config files again (theme, icons, keys)"
[[term.keymap]]
on = "<A-Up>"
run = "term_cd"
desc = "Put the pane where the shell is"
# A third of the window is right for a shell and too little for a full-screen
# program. Ctrl and Shift together keep this off the shell's keyboard, the same
# reason the scrollback keys carry Shift.
[[term.keymap]]
on = "<C-S-Enter>"
run = "term_max"
desc = "Give the terminal pane the window, or hand it back"

# Scrollback and search. Shift is what keeps these out of the shell's way:
# a program reading the keyboard sees PageUp, never Shift+PageUp.
[[term.keymap]]
on = "<S-PageUp>"
run = "term_scroll -50%"
desc = "Scroll back half a screen"
[[term.keymap]]
on = "<S-PageDown>"
run = "term_scroll 50%"
desc = "Scroll forward half a screen"
[[term.keymap]]
on = "<S-Home>"
run = "term_scroll top"
desc = "To the top of the scrollback"
[[term.keymap]]
on = "<S-End>"
run = "term_scroll bot"
desc = "Back to the bottom"

# The same keys that scroll the preview from the list and the help panel from
# itself: `<A-j>` and `<A-k>` mean "move the thing I am reading" everywhere in
# this app, and the pane it does not work in is the one you notice.
#
# These are the exception to the Shift rule above, and the one that costs
# something: a plain Alt+letter does reach a program reading the keyboard, so a
# `nvim` run inside this pane no longer sees Alt+j or Alt+k. Deliberate --
# consistency across the panes was worth more here.
#
# Handing them back means replacing this whole section with `[term] keymap =
# [...]` minus these two. `prepend_keymap` cannot do it: a key bound to anything
# at all, `noop` included, is consumed here and never reaches the shell.
[[term.keymap]]
on = "<A-k>"
run = "term_scroll -5"
desc = "Scroll the terminal up"
[[term.keymap]]
on = "<A-j>"
run = "term_scroll 5"
desc = "Scroll the terminal down"
[[term.keymap]]
on = "<C-S-f>"
run = "term_find"
desc = "Find in the scrollback"
[[term.keymap]]
on = "<C-S-n>"
run = "term_find --repeat"
desc = "Find the next match"
[[term.keymap]]
on = "<C-S-b>"
run = "term_find --repeat --prev"
desc = "Find the previous match"

# --- Input line ---------------------------------------------------------------
# The input line is a native widget (so IME and clipboard behave), which means
# only these three actions are configurable.

[[input.keymap]]
on = "<Enter>"
run = "close --submit"
desc = "Submit"
[[input.keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel"
[[input.keymap]]
on = "<Tab>"
run = "complete"
desc = "Complete the path"

[[confirm.keymap]]
on = "<Enter>"
run = "close --submit"
desc = "Confirm"
[[confirm.keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel"

[[pick.keymap]]
on = "<Enter>"
run = "close --submit"
desc = "Submit"
[[pick.keymap]]
on = "<Esc>"
run = "close"
desc = "Cancel"

[[help.keymap]]
on = "<Esc>"
run = "close"
desc = "Close help"
[[help.keymap]]
on = "q"
run = "close"
desc = "Close help"
# The keys that opened the panel close it again: a reader who pressed `~` to see
# the list reaches for `~` to put it away.
[[help.keymap]]
on = "~"
run = "help"
desc = "Close help"
[[help.keymap]]
on = "<F1>"
run = "help"
desc = "Close help"
[[help.keymap]]
on = "C"
run = "copy all"
desc = "Copy the whole list as text"
# The panel's own config rows say "<C-F5> re-reads config", so the key has to
# work with the panel open; it stays open, showing what was read.
[[help.keymap]]
on = "<C-F5>"
run = "config_reload"
desc = "Read the config files again (theme, icons, keys)"
[[help.keymap]]
on = "k"
run = "arrow -1"
desc = "Up one line"
[[help.keymap]]
on = "j"
run = "arrow 1"
desc = "Down one line"
[[help.keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Up one line"
[[help.keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Down one line"
# Half a page on both the Alt and the Ctrl pair. `<A-j>` is what scrolls the
# panel next to the list -- the preview, the spotter -- so it is the key a hand
# already in this app reaches for; `<C-u>` / `<C-d>` is what a hand coming from
# vim reaches for, and the comparison view already answers to it.
[[help.keymap]]
on = "<A-k>"
run = "arrow -50%"
desc = "Up half a page"
[[help.keymap]]
on = "<A-j>"
run = "arrow 50%"
desc = "Down half a page"
[[help.keymap]]
on = "<C-u>"
run = "arrow -50%"
desc = "Up half a page"
[[help.keymap]]
on = "<C-d>"
run = "arrow 50%"
desc = "Down half a page"
[[help.keymap]]
on = "<PageUp>"
run = "arrow -100%"
desc = "Up a page"
[[help.keymap]]
on = "<PageDown>"
run = "arrow 100%"
desc = "Down a page"
[[help.keymap]]
on = [ "g", "g" ]
run = "arrow top"
desc = "To the top"
[[help.keymap]]
on = "G"
run = "arrow bot"
desc = "To the bottom"

# Window scale, again. The layers do not fall through to `[mgr]`, so a binding
# that is only there stops working the moment any overlay opens -- and the scale
# is a property of the window, not of what happens to be on top of it. Every
# other layer still lacks these; see QA-REPORT.md.
[[help.keymap]]
on = "<C-+>"
run = "scale in"
desc = "Make everything bigger"
[[help.keymap]]
on = "<C-=>"
run = "scale in"
desc = "Make everything bigger"
[[help.keymap]]
on = "<C-->"
run = "scale out"
desc = "Make everything smaller"
[[help.keymap]]
on = "<C-0>"
run = "scale reset"
desc = "Back to the original size"

[[tasks.keymap]]
on = "<Esc>"
run = "close"
desc = "Close the task manager"
[[tasks.keymap]]
on = "q"
run = "close"
desc = "Close the task manager"
[[tasks.keymap]]
on = "j"
run = "arrow 1"
desc = "Next task"
[[tasks.keymap]]
on = "k"
run = "arrow -1"
desc = "Previous task"
[[tasks.keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Next task"
[[tasks.keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Previous task"
[[tasks.keymap]]
on = "p"
run = "task_toggle"
desc = "Pause / resume the task"
[[tasks.keymap]]
on = "x"
run = "task_cancel"
desc = "Cancel the task"
[[tasks.keymap]]
on = "t"
run = "task_top"
desc = "Move the task to the front of the queue"

# Window scale, as in `[mgr]` and `[help]`: the size of the window is not a
# property of what the task list happens to be showing.
[[tasks.keymap]]
on = "<C-+>"
run = "scale in"
desc = "Make everything bigger"
[[tasks.keymap]]
on = "<C-=>"
run = "scale in"
desc = "Make everything bigger"
[[tasks.keymap]]
on = "<C-->"
run = "scale out"
desc = "Make everything smaller"
[[tasks.keymap]]
on = "<C-0>"
run = "scale reset"
desc = "Back to the original size"

[[spot.keymap]]
on = "<Esc>"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "<Tab>"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "q"
run = "close"
desc = "Close the spotter"
# The spotter borrows the list's own arrangement, so that it reads like `<F3>`
# does: quick look is a flag rather than an overlay, so there the `[mgr]` layer
# is still live and `hjkl` mean what they always mean, with `<A-j>` scrolling
# what is on show. Keeping the plain keys on the panel's own rows instead made
# the same fingers do two different things depending on which of the two was
# open -- and the panel is the thing you are least often moving around in. It
# is a page of facts about one file, and the reason to hold it open is to run
# it past several.
[[spot.keymap]]
on = "k"
run = "swipe -1"
desc = "Spot the previous file"
[[spot.keymap]]
on = "j"
run = "swipe 1"
desc = "Spot the next file"
[[spot.keymap]]
on = "h"
run = "leave"
desc = "Go back to the parent directory"
[[spot.keymap]]
on = "l"
run = "enter"
desc = "Enter the directory"
[[spot.keymap]]
on = "<A-k>"
run = "arrow -1"
desc = "Previous line of the panel"
[[spot.keymap]]
on = "<A-j>"
run = "arrow 1"
desc = "Next line of the panel"
[[spot.keymap]]
on = "c"
run = "copy cell"
desc = "Copy the selected value"
[[spot.keymap]]
on = "C"
run = "copy all"
desc = "Copy the whole panel, labelled"
[[spot.keymap]]
on = "<Enter>"
run = "enter"
desc = "Open the pull request or branch on its rows; enter the directory elsewhere"
[[spot.keymap]]
on = "<Up>"
run = "swipe -1"
desc = "Spot the previous file"
[[spot.keymap]]
on = "<Down>"
run = "swipe 1"
desc = "Spot the next file"
[[spot.keymap]]
on = "<A-Up>"
run = "arrow -1"
desc = "Previous line of the panel"
[[spot.keymap]]
on = "<A-Down>"
run = "arrow 1"
desc = "Next line of the panel"
[[spot.keymap]]
on = "<Left>"
run = "leave"
desc = "Go back to the parent directory"
[[spot.keymap]]
on = "<Right>"
run = "enter"
desc = "Enter the directory"
[[spot.keymap]]
on = "y"
run = "copy cell"
desc = "Copy the selected value"

# Window scale, as in `[mgr]` and `[help]`: the size of the window is not a
# property of which cell of the spot panel is selected.
[[spot.keymap]]
on = "<C-+>"
run = "scale in"
desc = "Make everything bigger"
[[spot.keymap]]
on = "<C-=>"
run = "scale in"
desc = "Make everything bigger"
[[spot.keymap]]
on = "<C-->"
run = "scale out"
desc = "Make everything smaller"
[[spot.keymap]]
on = "<C-0>"
run = "scale reset"
desc = "Back to the original size"

