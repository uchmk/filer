[[spot.keymap]]
on = "<Esc>"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "<Tab>"
run = "close"
desc = "Close the spotter"
[[spot.keymap]]
on = "q"
run = "close"
desc = "Close the spotter"
# The spotter borrows the list's own arrangement, so that it reads like `<F3>`
# does: quick look is a flag rather than an overlay, so there the `[mgr]` layer
# is still live and `hjkl` mean what they always mean, with `<A-j>` scrolling
# what is on show. Keeping the plain keys on the panel's own rows instead made
# the same fingers do two different things depending on which of the two was
# open -- and the panel is the thing you are least often moving around in. It
# is a page of facts about one file, and the reason to hold it open is to run
# it past several.
[[spot.keymap]]
on = "k"
run = "swipe -1"
desc = "Spot the previous file"
[[spot.keymap]]
on = "j"
run = "swipe 1"
desc = "Spot the next file"
[[spot.keymap]]
on = "h"
run = "leave"
desc = "Go back to the parent directory"
[[spot.keymap]]
on = "l"
run = "enter"
desc = "Enter the directory"
[[spot.keymap]]
on = "<A-k>"
run = "arrow -1"
desc = "Previous line of the panel"
[[spot.keymap]]
on = "<A-j>"
run = "arrow 1"
desc = "Next line of the panel"
[[spot.keymap]]
on = "c"
run = "copy cell"
desc = "Copy the selected value"
[[spot.keymap]]
on = "<Up>"
run = "swipe -1"
desc = "Spot the previous file"
[[spot.keymap]]
on = "<Down>"
run = "swipe 1"
desc = "Spot the next file"
[[spot.keymap]]
on = "<A-Up>"
run = "arrow -1"
desc = "Previous line of the panel"
[[spot.keymap]]
on = "<A-Down>"
run = "arrow 1"
desc = "Next line of the panel"
[[spot.keymap]]
on = "<Left>"
run = "leave"
desc = "Go back to the parent directory"
[[spot.keymap]]
on = "<Right>"
run = "enter"
desc = "Enter the directory"
[[spot.keymap]]
on = "y"
run = "copy cell"
desc = "Copy the selected value"

# --- Compare (side by side) ---------------------------------------------------

[[diff.keymap]]
on = "q"
run = "close"
desc = "Close the comparison"
[[diff.keymap]]
on = "<Esc>"
run = "close"
desc = "Close the comparison"
[[diff.keymap]]
on = "k"
run = "arrow -1"
desc = "Up one line"
[[diff.keymap]]
on = "j"
run = "arrow 1"
desc = "Down one line"
[[diff.keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Up one line"
[[diff.keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Down one line"
[[diff.keymap]]
on = "<C-u>"
run = "arrow -50%"
desc = "Up half a page"
[[diff.keymap]]
on = "<C-d>"
run = "arrow 50%"
desc = "Down half a page"
[[diff.keymap]]
on = [ "g", "g" ]
run = "arrow top"
desc = "To the top"
[[diff.keymap]]
on = "G"
run = "arrow bot"
desc = "To the bottom"
[[diff.keymap]]
on = "n"
run = "find_arrow"
desc = "To the next difference"
[[diff.keymap]]
on = "N"
run = "find_arrow --previous"
desc = "To the previous difference"
