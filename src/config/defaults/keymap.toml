run = "cd ~/Documents"
desc = "Go to the documents directory"
# Two directories are read, and the one you are most likely to be looking for
# is filer's own -- `filer.toml` belongs there, and `<F1>` names both with the
# empty one marked. `g`+`c` goes to filer's, `g`+`y` to yazi's, which is where
# `keymap.toml`, `theme.toml` and `yazi.toml` usually live.
#
# The variables are what filer searched, not what the platform calls the folder,
# and they resolve whether or not anyone set them. These used to read
# `%APPDATA%/filer` and `%APPDATA%/yazi/config`, which named the right places on
# Windows and nothing at all anywhere else: an unset `%VAR%` expands to the empty
# string, so `gc` walked to `/filer` and reported it missing.
[[mgr.keymap]]
on = [ "g", "c" ]
run = "cd %FILER_CONFIG_HOME%"
desc = "Go to filer's config directory"
[[mgr.keymap]]
on = [ "g", "y" ]
run = "cd %YAZI_CONFIG_HOME%"
desc = "Go to yazi's config directory"
[[mgr.keymap]]
on = [ "g", "t" ]
run = "cd %TEMP%"
desc = "Go to the temporary directory"
[[mgr.keymap]]
on = [ "g", "<Space>" ]
run = "cd --interactive"
desc = "Jump interactively"
[[mgr.keymap]]
on = [ "g", "f" ]
run = "follow"
desc = "Follow the hovered symlink"
[[mgr.keymap]]
# Not a yazi command. The `g` chord is where views live, and `u` alone is undo.
on = [ "g", "u" ]
run = "usage"
desc = "Measure what is taking up the space here"

