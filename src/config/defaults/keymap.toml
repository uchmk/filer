# --- Goto ---------------------------------------------------------------------

[[mgr.keymap]]
on = [ "g", "h" ]
run = "cd ~"
desc = "Go to the home directory"
[[mgr.keymap]]
on = [ "g", "d" ]
run = "cd ~/Downloads"
desc = "Go to the downloads directory"
[[mgr.keymap]]
on = [ "g", "D" ]
run = "cd ~/Documents"
desc = "Go to the documents directory"
# Two directories are read, and the one you are most likely to be looking for
# is filer's own -- `filer.toml` belongs there, and `<F1>` names both with the
# empty one marked. `g`+`c` goes to filer's, `g`+`y` to yazi's, which is where
# `keymap.toml`, `theme.toml` and `yazi.toml` usually live.
[[mgr.keymap]]
on = [ "g", "c" ]
run = "cd %APPDATA%/filer"
desc = "Go to filer's config directory"
[[mgr.keymap]]
on = [ "g", "y" ]
run = "cd %APPDATA%/yazi/config"
desc = "Go to yazi's config directory"
[[mgr.keymap]]
on = [ "g", "t" ]
run = "cd %TEMP%"
desc = "Go to the temporary directory"
[[mgr.keymap]]
on = [ "g", "<Space>" ]
run = "cd --interactive"
desc = "Jump interactively"
[[mgr.keymap]]
on = [ "g", "f" ]
run = "follow"
desc = "Follow the hovered symlink"

