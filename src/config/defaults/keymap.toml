# F3 is "view" in every file manager going back to Norton Commander. `<Space>`
# would be the macOS key, but it toggles the selection here as it does in yazi,
# and a bare printable key with Shift held never reaches the keymap anyway.
[[mgr.keymap]]
on = "<F3>"
run = "quick"
desc = "Quick look: the hovered file, big, over the panes"

# yazi's `toggle-pane max-preview`, which the plugin bridge has understood since
# it was written but nothing was bound to. `T` is the key yazi's own docs use for
# it, and is free here -- `t` is a new tab.
#
# Written `T`, never `<S-t>`: a printable key arrives as typed text, so Shift is
# already in the character by the time the keymap sees it. `<S-t>` parses without
# complaint and then matches nothing at all.
#
# This is not `<F3>` with a different width. `max-preview` widens the preview
# *column*, so the panes and the status bar stay as they are and `T` puts it back.
# `<F3>` is a modal drawn over them: it dims the background and frames the preview
# with the file's name. `<Esc>` gets out of either one -- the list is invisible
# under a maximized preview, and without that the next key tried was `q`.
[[mgr.keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.keymap]]
on = "<A-k>"
run = "seek -5"
desc = "Scroll the preview up"
[[mgr.keymap]]
on = "<A-j>"
run = "seek 5"
desc = "Scroll the preview down"

# Image preview. Ctrl and the wheel zoom about the pointer, dragging pans, and
