# --- Terminal pane ------------------------------------------------------------
# Only what is bound here is kept; every other key goes to the shell, which is
# what makes the pane a terminal rather than another set of bindings.

# `<C-t>` is the way in and the way back out, and it leaves the shell running:
# going to and fro is something you do all day, ending the shell a few times.
# The destructive one is the harder chord on purpose.
[[term.keymap]]
on = "<C-t>"
run = "close"
desc = "Give the keys back to the list (the shell keeps running)"
[[term.keymap]]
on = "<C-S-t>"
run = "terminal close"
desc = "Close the terminal and end the shell"
# Two keys the shell has no use for, so the app keeps them: without these the
# help and the palette are unreachable while the terminal holds the keys.
[[term.keymap]]
on = "<F1>"
run = "help"
desc = "Show the key list"
[[term.keymap]]
on = "<C-S-p>"
run = "palette"
desc = "Command palette"
[[term.keymap]]
on = "<A-Up>"
run = "term_cd"
desc = "Put the pane where the shell is"

# Scrollback and search. Shift is what keeps these out of the shell's way:
# a program reading the keyboard sees PageUp, never Shift+PageUp.
[[term.keymap]]
on = "<S-PageUp>"
run = "term_scroll -50%"
desc = "Scroll back half a screen"
[[term.keymap]]
on = "<S-PageDown>"
run = "term_scroll 50%"
desc = "Scroll forward half a screen"
[[term.keymap]]
on = "<S-Home>"
run = "term_scroll top"
desc = "To the top of the scrollback"
[[term.keymap]]
on = "<S-End>"
run = "term_scroll bot"
desc = "Back to the bottom"
[[term.keymap]]
on = "<C-S-f>"
run = "term_find"
desc = "Find in the scrollback"
[[term.keymap]]
on = "<C-S-n>"
run = "term_find --repeat"
desc = "Find the next match"
[[term.keymap]]
on = "<C-S-b>"
run = "term_find --repeat --prev"
desc = "Find the previous match"

