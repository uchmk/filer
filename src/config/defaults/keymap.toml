# Built-in keymap. Mirrors yazi's defaults so an existing yazi keymap.toml can
# prepend/append/replace on top of it. Users never edit this file; put your
# changes in yazi's keymap.toml (or filer's own keymap.toml).

[[mgr.keymap]]
on = "<Esc>"
run = "escape"
desc = "Exit visual mode, clear selection, or cancel search"
[[mgr.keymap]]
on = "q"
run = "quit"
desc = "Quit the process"
[[mgr.keymap]]
on = "<C-q>"
run = "quit"
desc = "Quit the process"
[[mgr.keymap]]
on = "<C-c>"
run = "close"
desc = "Close the current tab, or quit if it is the last"

# --- Navigation ---------------------------------------------------------------

[[mgr.keymap]]
on = "k"
run = "arrow -1"
desc = "Move cursor up"
[[mgr.keymap]]
on = "j"
run = "arrow 1"
desc = "Move cursor down"
[[mgr.keymap]]
on = "<Up>"
run = "arrow -1"
desc = "Move cursor up"
[[mgr.keymap]]
on = "<Down>"
run = "arrow 1"
desc = "Move cursor down"
[[mgr.keymap]]
on = "<C-u>"
run = "arrow -50%"
desc = "Move cursor up half page"
[[mgr.keymap]]
on = "<C-d>"
run = "arrow 50%"
desc = "Move cursor down half page"
[[mgr.keymap]]
on = "<C-b>"
run = "arrow -100%"
desc = "Move cursor up one page"
[[mgr.keymap]]
on = "<C-f>"
run = "arrow 100%"
desc = "Move cursor down one page"
[[mgr.keymap]]
on = "<PageUp>"
run = "arrow -100%"
desc = "Move cursor up one page"
[[mgr.keymap]]
on = "<PageDown>"
run = "arrow 100%"
desc = "Move cursor down one page"
[[mgr.keymap]]
on = [ "g", "g" ]
run = "arrow top"
desc = "Move cursor to the top"
[[mgr.keymap]]
on = "G"
run = "arrow bot"
desc = "Move cursor to the bottom"
[[mgr.keymap]]
on = "<Home>"
run = "arrow top"
desc = "Move cursor to the top"
[[mgr.keymap]]
on = "<End>"
run = "arrow bot"
desc = "Move cursor to the bottom"

[[mgr.keymap]]
on = "h"
run = "leave"
desc = "Go back to the parent directory"
[[mgr.keymap]]
on = "l"
run = "enter"
desc = "Enter the directory, or focus the file's outline"
[[mgr.keymap]]
on = "<Left>"
run = "leave"
desc = "Go back to the parent directory"
[[mgr.keymap]]
on = "<Right>"
run = "enter"
desc = "Enter the directory, or focus the file's outline"
[[mgr.keymap]]
on = "<Backspace>"
run = "leave"
desc = "Go back to the parent directory"
[[mgr.keymap]]
on = "H"
run = "back"
desc = "Go back to the previous directory"
[[mgr.keymap]]
on = "L"
run = "forward"
desc = "Go forward to the next directory"
# What Explorer and every browser use for the same pair, for the hand that is
# already on the arrows rather than on `H` and `L`.
[[mgr.keymap]]
on = "<A-Left>"
run = "back"
desc = "Go back to the previous directory"
[[mgr.keymap]]
on = "<A-Right>"
run = "forward"
desc = "Go forward to the next directory"
[[mgr.keymap]]
on = "<F5>"
run = "refresh"
desc = "Re-read the current directory"
[[mgr.keymap]]
on = "<C-F5>"
run = "config_reload"
desc = "Read the config files again (theme, icons, keys)"
# F3 is "view" in every file manager going back to Norton Commander. `<Space>`
# would be the macOS key, but it toggles the selection here as it does in yazi,
# and a bare printable key with Shift held never reaches the keymap anyway.
[[mgr.keymap]]
on = "<F3>"
run = "quick"
desc = "Quick look: the hovered file, big, over the panes"

[[mgr.keymap]]
on = "<A-k>"
run = "seek -5"
desc = "Scroll the preview up"
[[mgr.keymap]]
on = "<A-j>"
run = "seek 5"
desc = "Scroll the preview down"

# Image preview. Ctrl and the wheel zoom about the pointer, dragging pans, and
# a double-click goes back to fitting the pane. Letters rather than `+` and `-`:
# on a JIS layout `=` is Shift and the minus key, which arrives as a different
# key entirely, so the obvious pair would work on one keyboard and not another.
[[mgr.keymap]]
on = "<A-i>"
run = "zoom in"
desc = "Zoom into the image"
[[mgr.keymap]]
on = "<A-o>"
run = "zoom out"
desc = "Zoom out of the image"
[[mgr.keymap]]
on = "<A-0>"
run = "zoom fit"
desc = "Fit the image to the pane"
[[mgr.keymap]]
on = "<A-1>"
run = "zoom actual"
desc = "Show the image at 1:1"
[[mgr.keymap]]
on = "<A-n>"
run = "minimap"
desc = "Show or hide the preview's minimap"
[[mgr.keymap]]
on = "M"
run = "toggle_render"
desc = "Switch Markdown preview between rendered and source"
[[mgr.keymap]]
on = "<BackTab>"
run = "toggle_outline"
desc = "Focus the preview's outline (functions / headings)"
[[mgr.keymap]]
on = "<Tab>"
run = "spot"
desc = "Spot hovered file"

# --- Selection ----------------------------------------------------------------

[[mgr.keymap]]
on = "<Space>"
run = [ "toggle", "arrow 1" ]
desc = "Toggle the current selection state"
[[mgr.keymap]]
on = "<C-a>"
run = "toggle_all --state=on"
desc = "Select all files"
# `<C-r>` is redo, as it is in vim and nearly everything else. That is yazi's
# key for inverting the selection, which moves to `<C-S-r>` -- the one place
# this keymap knowingly leaves yazi's defaults, because a reflex as widespread
# as Ctrl+R for redo is worth more than the compatibility.
[[mgr.keymap]]
on = "<C-S-r>"
run = "toggle_all"
desc = "Invert selection of all files"
[[mgr.keymap]]
on = "v"
run = "visual_mode"
desc = "Enter visual mode (selection mode)"
[[mgr.keymap]]
on = "V"
run = "visual_mode --unset"
desc = "Enter visual mode (unset mode)"

# --- Operations ---------------------------------------------------------------

[[mgr.keymap]]
on = "o"
run = "open"
desc = "Open the selected files"
[[mgr.keymap]]
on = "O"
run = "open --interactive"
desc = "Open the selected files interactively"
[[mgr.keymap]]
on = "<Enter>"
run = "open"
desc = "Open the selected files"
[[mgr.keymap]]
on = "<S-Enter>"
run = "open --interactive"
desc = "Open the selected files interactively"

[[mgr.keymap]]
on = "y"
run = "yank"
desc = "Yank the selected files (copy)"
[[mgr.keymap]]
on = "x"
run = "yank --cut"
desc = "Yank the selected files (cut)"
[[mgr.keymap]]
on = "Y"
run = "unyank"
desc = "Cancel the yank status"
[[mgr.keymap]]
on = "X"
run = "unyank"
desc = "Cancel the yank status"
[[mgr.keymap]]
on = "p"
run = "paste"
desc = "Paste the files"
[[mgr.keymap]]
on = "P"
run = "paste --force"
desc = "Paste the files (overwrite if the destination exists)"
[[mgr.keymap]]
on = "-"
run = "link"
desc = "Symlink the absolute path of yanked files"
[[mgr.keymap]]
on = "_"
run = "link --relative"
desc = "Symlink the relative path of yanked files"
[[mgr.keymap]]
on = "<C-->"
run = "hardlink"
desc = "Hardlink the yanked files"

# Copy / move straight into the other pane. Deliberately not F5 / F6: F5 is
# refresh here and in every browser, so putting a file operation on it would
# write files for someone reaching for a reload — and F6 / F7 would half-match
# Total Commander, where F6 means move, which is worse still.
[[mgr.keymap]]
on = "<A-c>"
run = "send_pane"
desc = "Copy the selection to the other pane"
[[mgr.keymap]]
on = "<A-m>"
run = "send_pane --cut"
desc = "Move the selection to the other pane"

[[mgr.keymap]]
on = "e"
run = "extract"
desc = "Extract the selected archives"
[[mgr.keymap]]
on = "E"
run = "compress"
desc = "Compress the selection into an archive"

[[mgr.keymap]]
on = "d"
run = "remove"
desc = "Move the files to the recycle bin"
[[mgr.keymap]]
on = "D"
run = "remove --permanently"
desc = "Permanently delete the files"
[[mgr.keymap]]
on = "u"
run = "undo"
desc = "Undo the last rename, or put the last deleted files back"
# Two keys, because both reflexes are real: `U` is what was here first, and
# vim's `U` is "undo this line", which nothing here has.
[[mgr.keymap]]
on = "U"
run = "redo"
desc = "Redo what undo took back"
[[mgr.keymap]]
on = "<C-r>"
run = "redo"
desc = "Redo what undo took back"
[[mgr.keymap]]
on = "a"
run = "create"
desc = "Create a file; end with / or \\ for a directory"
[[mgr.keymap]]
on = "r"
run = "rename"
desc = "Rename the file or directory"
[[mgr.keymap]]
on = "R"
run = "bulk_rename"
desc = "Rename everything selected by one rule"
[[mgr.keymap]]
on = "<A-d>"
run = "compare"
desc = "Compare two files side by side"
[[mgr.keymap]]
on = ";"
run = "shell --interactive"
desc = "Run a shell command"
[[mgr.keymap]]
on = ":"
run = "shell --interactive --block"
desc = "Run a shell command (block until finished)"
[[mgr.keymap]]
on = "."
run = "hidden"
desc = "Toggle the visibility of hidden files"

[[mgr.keymap]]
on = [ "c", "c" ]
run = "copy path"
desc = "Copy the absolute path"
[[mgr.keymap]]
on = [ "c", "d" ]
run = "copy dirname"
desc = "Copy the path of the parent directory"
[[mgr.keymap]]
on = [ "c", "f" ]
run = "copy filename"
desc = "Copy the name of the file"
[[mgr.keymap]]
on = [ "c", "n" ]
run = "copy name_without_ext"
desc = "Copy the name of the file without extension"

# --- Find / filter / search ---------------------------------------------------

[[mgr.keymap]]
on = "/"
run = "find --smart"
desc = "Find next file"
[[mgr.keymap]]
on = "?"
run = "find --previous --smart"
desc = "Find previous file"
[[mgr.keymap]]
on = "n"
run = "find_arrow"
desc = "Go to the next found file"
[[mgr.keymap]]
on = "N"
run = "find_arrow --previous"
desc = "Go to the previous found file"
[[mgr.keymap]]
on = "f"
run = "filter --smart"
desc = "Filter the files"
[[mgr.keymap]]
on = "s"
run = "search --via=name"
desc = "Search files by name, recursively"
[[mgr.keymap]]
on = "S"
run = "search --via=content"
desc = "Search files by content, recursively"
[[mgr.keymap]]
on = "<C-s>"
run = "escape --search"
desc = "Cancel the ongoing search"
[[mgr.keymap]]
on = "z"
run = "jump"
desc = "Jump to a bookmark or a recently visited directory"

# Bookmarks. `'` jumps and `b` is the prefix everything else hangs off, which
# is what both references do: vim jumps to a mark with `'` (and lists them with
# `:marks`), and bookmarks.yazi — yazi has no bookmarks of its own — jumps with
# `'` and deletes with `b`+`d`.
#
# Saving is the one that cannot follow them. Both save with `m`, and `m` is the
# line-mode prefix here as it is in yazi, so it sits under the same `b` as the
# rest of the management.
[[mgr.keymap]]
on = "'"
run = "plugin bookmarks jump"
desc = "Go to the bookmark under a letter"
[[mgr.keymap]]
on = [ "b", "b" ]
run = "plugin bookmarks list"
desc = "List the bookmarks, and go to one"
[[mgr.keymap]]
on = [ "b", "s" ]
run = "plugin bookmarks save"
desc = "Bookmark this directory under a letter"
[[mgr.keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks delete"
desc = "Delete the bookmark under a letter"
[[mgr.keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks delete_all"
desc = "Delete every bookmark"
# The keys these replaced, kept so that fingers trained on them still land.
[[mgr.keymap]]
on = "B"
run = "plugin bookmarks save"
desc = "Bookmark this directory under a letter (same as `bs`)"
[[mgr.keymap]]
on = "<A-b>"
run = "plugin bookmarks delete"
desc = "Delete the bookmark under a letter (same as `bd`)"
[[mgr.keymap]]
on = "<A-B>"
run = "plugin bookmarks delete_all"
desc = "Delete every bookmark (same as `bD`)"

