# Window scale. egui does this itself on the same three chords, at the end of
# the frame and without consuming the key, so both it and the binding under
# `<C-->` used to run: one shrink from egui and one from the keymap on a single
# press. It is switched off there and done here, where `~` lists it and the
# keymap can move it.
#
# Both `<C-+>` and `<C-=>`, because "bigger" is a different physical key per
# layout: on US `+` is shift+equals, on JIS it is shift+semicolon while `=` is
# shift+minus. Either spelling reaches the same command. This needs `from_egui`
# to keep the shift out of a symbol's `Key` -- see `src/config/keys.rs`; while
# it did not, neither of these two ever fired.
#
# Not `<C-^>`, tempting as it looks beside `<C-->` on a JIS board: egui 0.36 has
# no caret in `egui::Key` and `Key::from_name` does not accept "^", so the press
# never becomes a key event and the binding would be dead on arrival.
[[mgr.keymap]]
on = "<C-+>"
run = "scale in"
desc = "Make everything bigger"
[[mgr.keymap]]
on = "<C-=>"
run = "scale in"
desc = "Make everything bigger"
[[mgr.keymap]]
on = "<C-->"
run = "scale out"
desc = "Make everything smaller"
[[mgr.keymap]]
on = "<C-0>"
run = "scale reset"
desc = "Back to the original size"

# Copy / move straight into the other pane. Deliberately not F5 / F6: F5 is
# refresh here and in every browser, so putting a file operation on it would
# write files for someone reaching for a reload — and F6 / F7 would half-match
# Total Commander, where F6 means move, which is worse still.
#
# Nor `<A-y>` / `<A-x>`, which is the likelier guess: `yank` means "into the
# register", and these never touch it. The register survives both, so `p` still
# pastes whatever `y` last held — a name built on `y` would promise a `p` that
# is not wanted and an overwrite that does not happen. The letters are the
# words for what they do, which is the whole operation, at once, into a
# destination that is already decided.
[[mgr.keymap]]
on = "<A-c>"
run = "send_pane"
desc = "Copy the selection to the other pane"
[[mgr.keymap]]
on = "<A-m>"
run = "send_pane --cut"
desc = "Move the selection to the other pane"

